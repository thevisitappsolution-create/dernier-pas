function winFx(style, hex, cv, dur=4200){
  if (!cv) return; const ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  const parts=[], t0=performance.now(), R=Math.random;
  const star=(x,y,r,rot)=>{ ctx.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5, rr=i%2?r*.45:r; ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); };
  const burst=(x,y)=>{ const cols=[hex,'#ffffff','#ffd75e','#ff3dd8','#2ef2ff']; for(let i=0;i<60;i++){ const a=R()*Math.PI*2, v=(3+R()*7)*dpr; parts.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[i%cols.length],l:1,s:(2+R()*2.5)*dpr}); } };
  let nextBurst=0, crown=style==='couronne'?{y:-120*dpr,vy:0}:null;
  const step=now=>{
    const el=now-t0; ctx.clearRect(0,0,W,H);
    if (style==='feux' && el>nextBurst && el<dur-900){ burst(W*(.2+R()*.6), H*(.15+R()*.35)); nextBurst=el+380; }
    if ((style==='etoiles'||style==='pluie'||style==='couronne') && el<dur-1200) for(let i=0;i<(style==='couronne'?2:style==='pluie'?(R()<.45?1:0):4);i++) parts.push({k:style==='pluie'?'coin':'star',x:R()*W,y:-20*dpr,vx:(R()-.5)*1.5*dpr,vy:(2+R()*4)*dpr,rot:R()*6,vr:(R()-.5)*.2,s:(7+R()*9)*dpr,c:style==='pluie'?'#ffd75e':[hex,'#ffd75e','#ffffff'][i%3],l:1});
    for (const p of parts){ p.x+=p.vx; p.y+=p.vy; if(p.k==='spark'){ p.vy+=.08*dpr; p.vx*=.98; p.l-=.012; ctx.globalAlpha=Math.max(0,p.l); ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=10*dpr; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
      else if(p.k==='coin'){ p.rot+=p.vr; ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.save(); ctx.translate(p.x,p.y); const sx=Math.max(.15,Math.abs(Math.cos(p.rot*3))); ctx.scale(sx,1); ctx.fillStyle='#8a5200'; ctx.beginPath(); ctx.arc(p.s*.12/sx,p.s*.1,p.s,0,7); ctx.fill(); const g=ctx.createRadialGradient(-p.s*.3,-p.s*.35,1,0,0,p.s); g.addColorStop(0,'#fff3b0'); g.addColorStop(.55,'#ffcf3a'); g.addColorStop(1,'#d68a00'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,p.s,0,7); ctx.fill(); ctx.strokeStyle='#b86e00'; ctx.lineWidth=p.s*.14; ctx.beginPath(); ctx.arc(0,0,p.s*.62,0,7); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-p.s*.35,-p.s*.4,p.s*.3,p.s*.16,-.5,0,7); ctx.fill(); ctx.restore(); }
      else { p.rot+=p.vr; ctx.globalAlpha=1; ctx.fillStyle=p.c; ctx.shadowColor=p.c; ctx.shadowBlur=12*dpr; star(p.x,p.y,p.s,p.rot); } }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    if (crown){ const target=H*.2; crown.vy+=.9*dpr; crown.y=Math.min(target, crown.y+crown.vy); if (crown.y>=target && crown.vy>0){ crown.vy=-crown.vy*.35; if (Math.abs(crown.vy)<2*dpr) crown.vy=0; }
      ctx.font=`${140*dpr}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.shadowColor='#ffd75e'; ctx.shadowBlur=40*dpr; ctx.fillText('👑', W/2, crown.y); ctx.shadowBlur=0; }
    for (let i=parts.length-1;i>=0;i--) if (parts[i].l<=0 || parts[i].y>H+40*dpr) parts.splice(i,1);
    if (el<dur || parts.length) raf=requestAnimationFrame(step); else { ctx.clearRect(0,0,W,H); raf=null; }
  };
  stopConfetti(); raf=requestAnimationFrame(step);
}

function fxRun(style, hex, cv){

/* ---------- Recherche d'adversaire en ligne (sans serveur de jeu) ---------- */
/* Recherche d'adversaire « à la chess.com » : même cadence, niveau proche.
   Les joueurs attendent dans une file par cadence et par tranche de 100 points (steps de championnat).
   On cherche d'abord dans sa tranche (±50), puis la recherche s'élargit avec le temps : ±150 après 8 s, ±250 après 20 s, ±350 après 35 s.
   Jamais au-delà : on ne gagne pas de points facilement contre des joueurs bien plus faibles.
   Pour éviter que deux joueurs se cherchent en même temps, c'est toujours le mieux classé qui va chercher dans les tranches en dessous. */
const MM_SLOTS=3, MM_W=100, MM_WIDEN=[[4000,1],[9000,2],[14000,3]], MM_GIVEUP=20000;
const mmRating = () => getR('champ',P.time).r;
const mmBucket = r => Math.floor(r/MM_W);
const mmSlot = (i, b) => `lastep-q3-${P.time}-${b==null?mmBucket(mmRating()):b}-${i}`;
const mmRange = me => { const r=mmRating(), w=(me&&me.widen)||0; return [Math.max(0,(mmBucket(r)-w)*MM_W), (mmBucket(r)+w+1)*MM_W-1]; };
function mmWidenLoop(me){
  MM_WIDEN.forEach(([ms,step])=>setTimeout(()=>{ if (net!==me || me.opp || me.matched) return; me.widen=step; render(); mmProbe(me, mmBucket(mmRating())-step, 0); }, ms));
}
// va voir si quelqu'un attend dans une tranche plus basse ; si oui, on le rejoint et on quitte sa propre file
function mmProbe(me, b, i){
  if (net!==me || me.opp || me.matched || b<0 || i>=MM_SLOTS) return;
  let pr; try { pr=new Peer(); } catch(e){ return; }
  let done=false; const end=next=>{ if (done) return; done=true; try { if (!me.matched || me.probe!==pr) pr.destroy(); } catch(e){} if (next) mmProbe(me, b, i+1); };
  const tm=setTimeout(()=>end(true), 9000);
  pr.on('open', ()=>{
    if (net!==me || me.opp || me.matched){ clearTimeout(tm); end(false); return; }
    const c=pr.connect(mmSlot(i,b), {reliable:true});
    c.on('open', ()=>{
      clearTimeout(tm);
      if (net!==me || me.opp || me.matched){ try { c.close(); } catch(e){} end(false); return; }
      me.matched=true; me.probe=pr; done=true; const host=me.peer; me.peer=pr; me.seat=1;
      try { host && host.destroy(); } catch(e){}
      wireConn(c); try { c.send({t:'hello', nm:P.name, sk:P.skin, uid:P.uid, nb:myBlock(), rc:Object.fromEntries(TIMES.map(t=>[t,getR('champ',t).r]))}); } catch(e){}
      net.lastSeen=Date.now(); clearInterval(net.hb); net.hb=setInterval(()=>netSend({t:'ping'}), 3000);
    });
  });
  pr.on('error', ()=>{ clearTimeout(tm); end(true); });
}
function goMatch(i){
  i=i||0;
  if (!peerOK()){ sheet={type:'friend'}; render(); return; }
  leaveOnline(); vsAI=null; PEERS={}; M=null; G=null; view=view==='game'?'play':view;
  if (i>=MM_SLOTS){ leaveOnline(); mmw('noone'); return; }
  const me=net={code:'', peer:null, conn:null, seat:0, seq:0, opp:false, err:'', mm:true, slot:i, widen:0, t0:Date.now()};
  sheet=null; mmw('search'); render();
  setTimeout(()=>{ if (net===me && !me.opp && !me.matched){ leaveOnline(); mmw('noone'); } }, MM_GIVEUP);
  let peer; try { peer=new Peer(mmSlot(i)); } catch(e){ me.err=(T("Connexion impossible pour le moment.")); render(); return; }
  me.peer=peer;
  peer.on('open', ()=>{ if (net===me){ me.stage=''; render(); mmWidenLoop(me); } });
  peer.on('connection', conn=>{
    if (net!==me){ conn.close(); return; }
    if (me.conn && me.conn.open){ conn.on('open',()=>{ conn.send({t:'full'}); setTimeout(()=>conn.close(),300); }); return; }
    wireConn(conn);
    conn.on('open', ()=>{ me.matched=true; setTimeout(()=>{ try { if (net===me) peer.disconnect(); } catch(e){} }, 1500); });
  });
  peer.on('error', err=>{
    if (net!==me) return;
    const t=err && err.type;
    if (t==='unavailable-id'){ try { peer.destroy(); } catch(e){} me.stage=T("Un joueur de ton niveau attend : connexion…"); render(); mmGuest(i, me); return; }
    if (me.matched || me.opp) return;
    me.err=(T("Connexion au service en ligne impossible. Vérifie ta connexion internet.")); render();
  });
  peer.on('disconnected', ()=>{ if (net!==me || me.matched || me.opp) return; try { peer.reconnect(); } catch(e){} });
}
function mmGuest(i, me){
  me.seat=1; me.peer=null; let peer;
  try { peer=new Peer(); } catch(e){ net=null; goMatch(i+1); return; }
  me.peer=peer;
  const fail=()=>{ if (net!==me || me.opp) return; try { peer.destroy(); } catch(e){} net=null; goMatch(i+1); };
  me.timer=setTimeout(fail, 12000); // laisse le temps au réseau mobile (4G)
  peer.on('open', ()=>{ if (net!==me) return; wireConn(peer.connect(mmSlot(i), {reliable:true})); });
  peer.on('error', ()=>{ if (net===me && !me.opp) fail(); });
}
function mmCancel(){ leaveOnline(); sheet=null; mmwClose(); render(); }

function mmwPaint(){
  const el=document.getElementById('mmw'); if (!el || !MMW) return;
  const st=el.dataset.state, box=el.querySelector('.mmbox');
  if (st==='search'){
    const [lo,hi]=mmRange(net), w=(net&&net.widen)||0, el2=Date.now()-MMW.t0, left=Math.max(0,Math.ceil((MM_GIVEUP-el2)/1000)), pr=Math.min(1,el2/MM_GIVEUP);
    el.style.setProperty('--p', pr.toFixed(3));
    const html=`<h2>${T("Recherche d'un adversaire")}<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
      <div class="mmchip">${tLabel(P.time)} · <b>${lo} – ${hi}</b></div><div class="mmbar"><i style="width:${Math.round(pr*100)}%"></i></div><small>${left} s</small>`;
    if (box.dataset.h!==html){ box.innerHTML=html; box.dataset.h=html; }
  } else if (st==='noone'){
    if (el.dataset.dlg!=='1'){
      el.dataset.dlg='1'; const lv=mmBotLevel(), b=BOTS[lv];
      el.querySelector('.bav').innerHTML=pawnSVG(b.skin);
      box.innerHTML=''; box.dataset.h=''; box.classList.add('hide');
      const say=el.querySelector('.mmbot2 .mmsay');

    setTimeout(()=>mmwClose(true), 1700);

}
function mmwSay(t){ const el=document.getElementById('mmw'); if (!el) return; const s=el.querySelector('.mmsay.me'); s.textContent=t; s.classList.add('on'); el.querySelector('.mmbox').classList.add('hide'); }

/* ---------- Abandon ---------- */
function resignNow(){
  if (!M || M.done || !G){ leaveGame(); return; }
  if (online() && (net.seat===0||net.seat===1)){
    const me=net.seat; netSend({t:'resign'});
    M.wins[1-me]=needW(); M.done=true; M.forfeit=true; G.over=true; G.winner=1-me; recordGame();
  }
  leaveGame();
}

/* ---------- Puzzles : parcours ---------- */
const PUZ_LIST = PUZ_CATS.flatMap(c=>PUZ[c.k].map((_,i)=>({cat:c.k, i})));
const pzKey = q => q.cat+q.i;
const pzDone = () => PUZ_LIST.filter(q=>(P.puz||{})[pzKey(q)]).length;
const pzIndex = (cat,i) => PUZ_LIST.findIndex(q=>q.cat===cat && q.i===i);
const pzOpen = n => n===0 || !!(P.puz||{})[pzKey(PUZ_LIST[n-1])] || !!(P.puz||{})[pzKey(PUZ_LIST[n])];
/* ---------- Défis chrono ---------- */
const RUSH_FREE=3;
// Paliers : on débloque le suivant en atteignant l'objectif du palier en cours (3 min, 3 erreurs max)
const RUSH_MODES={bronze:{n:(T("Bronze")), e:'🥉', total:180000, pool:['win1'], target:6},
  argent:{n:(T("Argent")), e:'🥈', total:180000, pool:['win1','adv'], target:6},
  or:{n:(T("Or")), e:'🥇', total:180000, pool:['win2'], target:5},
  diamant:{n:(T("Diamant")), e:'💎', total:180000, pool:['win2','win3'], target:4}};
const RUSH_ORDER=['bronze','argent','or','diamant'];
let RUSH=null;
const rushBest = k => (P.rush||{})[k]||0;
const rushTier = () => RUSH_ORDER.find(k=>rushBest(k)<RUSH_MODES[k].target) || 'diamant';
const rushAllDone = () => RUSH_ORDER.every(k=>rushBest(k)>=RUSH_MODES[k].target);
const rushLeft = () => !RUSH ? 0 : Math.max(0, RUSH.total);
function rushTodayLeft(){ const d=dayKey(), r=P.rushDay||{}; return P.premium ? Infinity : Math.max(0, RUSH_FREE-(r.d===d?r.n:0)); }
function startRush(){
  const mode=rushTier();
  if (rushTodayLeft()<=0){ sheet={type:'locked', what:'rushday'}; render(); return; }
  if (!P.premium){ const d=dayKey(), r=P.rushDay||{}; P.rushDay={d, n:(r.d===d?r.n:0)+1}; saveP(); }
  const M0=RUSH_MODES[mode];
  RUSH={mode, score:0, err:0, total:M0.total, last:''};
  sheet=null; rushNext();
}
function rushNext(){
  const M0=RUSH_MODES[RUSH.mode];
  const pool=PUZ_LIST.filter(q=>M0.pool.includes(q.cat) && pzKey(q)!==RUSH.last);
  const q=pool[Math.floor(Math.random()*pool.length)]; RUSH.last=pzKey(q);
  startPuzzle(q.cat, q.i, 'rush');
}
function rushTick(dt){
  if (!TR || TR.state!=='play' || document.hidden) return;
  dt=Math.min(dt,1000); RUSH.total-=dt;
  const el=document.getElementById('clk0'); if (el){ el.textContent=fmt(rushLeft()); el.classList.toggle('low', rushLeft()<10000); }
  if (rushLeft()<=0){ toast((T("Temps écoulé !"))); rushEnd(); }
}
function rushAfter(ok){
  if (ok) RUSH.score++; else RUSH.err++;
  if (RUSH.err>=3) return setTimeout(rushEnd, 700);
  const r=RUSH; setTimeout(()=>{ if (RUSH===r) rushNext(); }, 650);
}
function rushEnd(){
  if (!RUSH) return; const r=RUSH; P.rush=P.rush||{}; const best=P.rush[r.mode]||0, rec=r.score>best, tgt=RUSH_MODES[r.mode].target;
  if (rec) P.rush[r.mode]=r.score; if (r.score) P.coins=(P.coins||0)+r.score*2; saveP();
  if (best<tgt && r.score>=tgt){ const i=RUSH_ORDER.indexOf(r.mode), nx=RUSH_ORDER[i+1]; setTimeout(()=>banner(RUSH_MODES[r.mode].e, `${RUSH_MODES[r.mode].n} ${T("validé")}`, nx?`${RUSH_MODES[nx].n} ${T("débloqué !")}`:(T("Tous les paliers validés !"))), 300); }
  if (TR) trClear(TR); TR=null; G=null; M=null; musicStop();
  view='home'; sheet={type:'rush', r, rec, best:Math.max(best,r.score)}; RUSH=null; render();
}
function renderPuzzles(){
  const ok=P.puz||{}, done=pzDone(), cur=PUZ_LIST.findIndex(q=>!ok[pzKey(q)]);
  const fr=P.friends.filter(f=>f.pz!=null);
  const ranked=[{me:1, pz:done}, ...fr.map(f=>({pz:f.pz}))].sort((a,b)=>b.pz-a.pz), myRank=ranked.findIndex(r=>r.me)+1;
  let n=0, html='';
  PUZ_CATS.forEach((c,ci)=>{
    html+=`<div class="ustep">${T("Étape")} ${ci+1} · ${esc(c.t)}</div>`;
    PUZ[c.k].forEach((_,i)=>{
      const k=n++, d=ok[c.k+i], open=pzOpen(k), isCur=k===cur, x=Math.round(Math.sin(k*0.95)*72);
      const here=fr.filter(f=>Math.min(f.pz, PUZ_LIST.length-1)===k);
      const prem=k>=PZ_FREE && !P.premium;
      html+=`<button type="button" class="node${d?' done':''}${isCur&&!prem?' cur':''}" style="--x:${x}px" data-act="puzzle" data-k="${c.k}" data-v="${i}" ${open?'':'disabled'} aria-label="${T("Puzzle")} ${k+1}, ${esc(c.t)}${d?(T(", réussi")):prem?(T(", Premium")):open?'':(T(", verrouillé"))}">${d?'★':!open?ic('lock'):prem?ic('gem'):k+1}${isCur?`<span class="me" aria-hidden="true">${pawnSVG(P.skin)}</span>`:''}${here.length?`<span class="frs">${here.slice(0,3).map(f=>`<span title="${esc(f.name)}">${pawnSVG(cleanSkin(f.sk))}</span>`).join('')}</span>`:''}</button>`;
    });
  });
  return `${backHead(T("Puzzles"),'parc')}
  <div class="pzhead"><div class="prog" role="progressbar" aria-label="${T("Progression")}" aria-valuemin="0" aria-valuemax="${PUZ_LIST.length}" aria-valuenow="${done}"><i style="width:${done/PUZ_LIST.length*100}%"></i></div>
  <p class="sub">${done}/${PUZ_LIST.length}${fr.length?` · <b>${myRank}${LANG==='en'?(myRank===1?'st':myRank===2?'nd':myRank===3?'rd':'th'):(myRank===1?'er':'e')}</b> ${T("sur")} ${ranked.length} ${T("amis")}`:''}</p></div>
  <div class="ppath">${html}<div class="ustep">${T("Saison 1 · bientôt")}</div></div>`;
}

function parcDone(ok, why){
  const tr=TR; if (!tr || tr.state!=='play') return;
  tr.state=ok?'win':'fail'; tr.why=why||''; G.over=true; G.winner=ok?0:null; G.ver++;
  if (ok) markActive();
  if (tr.mode==='dj'){ sfx[ok?'win':'round'](); render(); djAfter(ok); return; }
  tr.gain=0;
  if (ok){
    const st = tr.tries===0 ? 3 : tr.tries<=2 ? 2 : 1, old=parcStars(tr.i); tr.stars=st;
    if (st>old){ P.parc={...(P.parc||{}), [tr.i]:st}; tr.gain=(st-old)*3; P.coins=(P.coins||0)+tr.gain; saveP(); if (typeof xpAdd==='function') xpAdd((st-old)*10); }

}

const DEMO_MS=4200;
function stepMove(L, st){ if (st.mv) return st.mv; if (st.sol){ const z=L.demo.z; return [0,z.sol[0],z.sol[1],z.sol[2]]; } if (st.line!==undefined) return L.demo.line[st.line]; return null; }
function trClear(tr){ (tr.tm||[]).forEach(clearTimeout); tr.tm=[]; }
function trLater(tr, fn, ms){ (tr.tm=tr.tm||[]).push(setTimeout(()=>{ if (TR===tr && tr.phase==='demo') fn(); }, ms)); }
function demoReset(tr){
  const d=tr.L.demo;
  if (d.z){ G.cells=cellsFrom(d.z.c); G.pawns=d.z.p.map(x=>x.slice()); G.J=d.z.j.slice(); } else { G.cells=d.c.slice(); G.pawns=d.p.map(x=>x.slice()); G.J=[1,1]; }
  G.turn=0; G.pick=null; G.last=null; resetLook();
}
function demoApply(mv){ const [p,k,to,jump]=mv, from=G.pawns[p][k]; G.cells[from]--; G.pawns[p][k]=to; if (jump) G.J[p]=0; look(p,k,from,to); G.last={p,from,to,jump}; G.turn=1-p; G.pick=null; }
function demoGo(n){
  const tr=TR; if (!tr || tr.kind!=='lesson') return;
  const steps=tr.L.demo.steps; trClear(tr);
  if (n>=steps.length){ tr.phase='ready'; tr.step=steps.length; render(); return; }
  n=Math.max(0,n); tr.phase='demo'; tr.state='demo'; tr.step=n;
  demoReset(tr); for (let j=0;j<n;j++){ const mv=stepMove(tr.L, steps[j]); if (mv) demoApply(mv); }
  render();
  const mv=stepMove(tr.L, steps[n]);
  if (mv) trLater(tr, ()=>{ G.pick=mv[1]; G.turn=mv[0]; render(); trLater(tr, ()=>{ demoMove(...mv); render(); }, 600); }, 1100);
}

/* Partie piégée : une bombe cachée chacun, active pendant les 3 premiers coups */
const trapOn = () => !!(M && M.trap && G);
function trapStart(){
  if (!trapOn()) return;
  G.bombs=[null,null]; G.pm=[0,0]; G.bombPhase=true;
  const tg=[...new Set(aiGen(G.cells,G.pawns,G.J,0).filter(m=>!m[2]).map(m=>m[1]))];
  const free=G.cells.map((v,i)=>i).filter(i=>G.cells[i]>0 && !G.pawns[0].includes(i) && !G.pawns[1].includes(i));
  G.bombs[1] = tg.length && Math.random()<.55 ? tg[Math.floor(Math.random()*tg.length)] : free[Math.floor(Math.random()*free.length)];
}
function trapPlace(i){
  if (!G.bombPhase || G.cells[i]===0 || G.pawns[0].includes(i) || G.pawns[1].includes(i)) return;
  G.bombs[0]=i; G.bombPhase=false; G.turnAt=performance.now(); G.ver++; sfx.move(); vibrate(20); commit();
}
function trapCheck(t, to){   // renvoie true si la manche se termine
  if (!trapOn() || G.pm==null) return false;
  G.pm[t]++;
  if (G.bombs[1-t]!==null && G.bombs[1-t]===to && G.pm[t]<=3){ boom(to, t); G.msg = t===humanSeat() ? (T("💥 Tu as marché sur la bombe !")) : `💥 ${S[t].name} ${T("a marché sur ta bombe !")}`; G.turn=t; endRound(1-t); commit(); return true; }
  if (G.bombs[t]!==null && G.bombs[t]===to && G.pm[t]<=3){ G.bombs[t]=null; toast(`${S[t].name} ${T("désamorce sa propre bombe")}`); }
  if (G.pm[0]>=3 && G.pm[1]>=3 && (G.bombs[0]!==null || G.bombs[1]!==null)){ G.bombs=[null,null]; toast((T("3 coups chacun : les bombes sont désamorcées"))); }
  return false;
}

/* ---------- En ligne : premier coup en 15 s, absence de 15 s = défaite ---------- */
const AFK_MS=15000;
const firstDone = () => !!(M && M.fm && M.fm[0] && M.fm[1]);
function abortMatch(why, fromPeer){
  if (!M || M.done) return;
  if (!fromPeer) netSend({t:'abort', why: firstDone()?'net':'first'});
  M.done=true; M.aborted=true; leaveGame();
  sheet={type:'info', t:(T("Partie annulée")), p:`${why} ${T("Personne ne perd de points.")}`}; render();
}
function forfeitWin(msg){
  if (!M || M.done || !online()) return; const me=net.seat;
  M.wins[me]=needW(); M.wins[1-me]=Math.min(M.wins[1-me], needW()-1); M.done=true; M.forfeit=true; if (G){ G.over=true; G.winner=me; }
  toast(msg); render(); setTimeout(celebrate, 500);
}
function onlineWatch(){
  if (!online() || (net.seat!==0 && net.seat!==1) || !M || M.done || !G || view!=='game') return;
  const me=net.seat;
  if (!firstDone() && M.round===1 && !G.over && performance.now()>=introUntil && G.turnAt){
    const el=performance.now()-Math.max(G.turnAt,introUntil);
    if (el>AFK_MS) return abortMatch(G.turn===me ? (T("Tu n'as pas joué ton premier coup à temps.")) : (T("Ton adversaire n'a pas joué son premier coup à temps.")));
  }
  const gone=Date.now()-(net.lastSeen||Date.now());
  if (gone>AFK_MS){ if (firstDone()) forfeitWin((T("Ton adversaire a quitté la partie : victoire !"))); else abortMatch((T("Connexion perdue avant le premier coup."))); return; }
  if (gone>5000){ net.warned=true; const st=$('#gstatus'); if (st){ st.innerHTML=`${T("Ton adversaire ne répond plus…")} ${T(firstDone()?'victoire':'annulation')} ${T("dans")} <b>${Math.ceil((AFK_MS-gone)/1000)} s</b>`; st.classList.add('msg'); } }
}
let hiddenAt=0;
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){ hiddenAt=Date.now(); return; }
  const away=Date.now()-hiddenAt; hiddenAt=0;
  if (!online() || (net.seat!==0 && net.seat!==1) || !M || M.done || away<=AFK_MS) return;
  if (firstDone()){ const me=net.seat; netSend({t:'resign'}); M.wins[1-me]=needW(); M.done=true; M.forfeit=true; if (G){ G.over=true; G.winner=1-me; } recordGame(); leaveGame();
    sheet={type:'info', t:(T("Partie perdue")), p:(T("Tu as quitté l'appli plus de 15 secondes pendant la partie."))}; render(); }
  else abortMatch((T("Tu as quitté l'appli avant le premier coup.")));
});

const ASSETS=new Set(['arene','aventure-ile','coffre-argent-ouvert','coffre-argent','coffre-bois-ouvert','coffre-bois','coffre-legendaire','coffre-or-ouvert','coffre-or','couronne-royale','icone-cadeau','icone-cadenas','icone-calendrier','icone-carte','icone-epees','icone-maison','icone-parchemin','icone-plus','icone-profil','icone-roue','icone-trophee','logo-lastep']);
// image si elle existe, sinon émoji en relief (remplacé dès que l'icône arrive)
const ICO = (n, emo, cls='') => ASSETS.has(n) ? IMG(n, cls) : `<span class="emo3 ${cls}" aria-hidden="true">${emo}</span>`;
function pillsTop(){
  const t=tierOf(P.elo.r), streak=streakNow();
  return `<div class="htop">
    <div class="pill me2"><span class="adm" data-admin="1" aria-hidden="true"><span class="pav">${pawnSVG(P.skin)}</span></span><span class="pn"><b>${esc(P.name)}</b><small>${arenaElo()} · ${t[1]}</small></span></div>
    <span class="pill flame2" aria-label="${T("Série de")} ${streak} ${T("jours")}">🔥<b>${streak}</b></span>
    <button type="button" class="pill coin2" data-act="coins-shop" aria-label="${P.coins} ${T("pièces")}">${ic('coin')}<b>${P.coins}</b>${IMG('icone-plus','plus')}</button>
  </div>`;
}
const pageTitle = (img, emo, title, extra='') => `<div class="ptitle">${ICO(img,emo,'pti')}<h1>${title}</h1>${extra}</div>`;
const tile = (act, img, emo, label, o={}) => `<button type="button" class="rb${o.hot?' hot':''}" data-act="${act}"${o.v!=null?` data-v="${o.v}"`:''}>${ICO(img,emo)}<small>${label}</small></button>`;

/* ---------- Aventure ---------- */
function renderParc(){
  const tot=parcTotal(), max=PARC.length*3, cur=PARC.findIndex((_,i)=>!parcStars(i)), np=nextParc(), ch=Math.floor(np/PARC_PER), d=djToday();
  const chStars=[...Array(PARC_PER)].reduce((a,_,k)=>a+parcStars(ch*PARC_PER+k),0);
  let html='';
  PARC_CH.forEach((t,ci)=>{
    html+=`<div class="chap"><span>${T("Chapitre")} ${ci+1}</span><b>${esc(t)}</b></div>`;
    for (let i=ci*PARC_PER; i<Math.min(PARC.length,(ci+1)*PARC_PER); i++){
      const s=parcStars(i), open=parcOpen(i), isCur=i===cur, x=Math.round(Math.sin(i*0.95)*70);
      html+=`<button type="button" class="lv${s?' done':''}${isCur?' cur':''}${open?'':' lk'}" style="--x:${x}px" data-act="parc" data-v="${i}" ${open?'':'disabled'} aria-label="${T("Niveau")} ${i+1}${s?`, ${s} ${T("étoiles")}`:open?'':(T(", verrouillé"))}">
        ${open?`<b>${i+1}</b>`:IMG('icone-cadenas','lkimg')}${s?`<span class="lvst">${[0,1,2].map(k=>`<i class="${k<s?'on':''}">★</i>`).join('')}</span>`:''}${isCur?`<span class="lvme" aria-hidden="true">${pawnSVG(P.skin)}</span>`:''}</button>`;
    }
  });
  return `<div class="pgtop">${pillsTop()}${pageTitle('icone-carte','🗺️',T("Aventure"))}
    <div class="rrow2 r5">
      ${tile('dj','icone-calendrier','📅', d?d.res.map(r=>r?'✅':'❌').join(''):T("Du jour"), {hot:!d})}
      ${tile('tab','icone-puzzle','🧩',T("Puzzles"),{v:'puzzles'})}
      ${tile('rush-pick','icone-chrono','⏱️',T("Chrono"))}
      ${tile('tab','icone-cours','🎓',T("Cours"),{v:'learn'})}
      ${tile('lb-open','icone-trophee','🏆', P.lg&&P.lg.rank?`${P.lg.rank}${LANG==='en'?'.':'e'}`:T("Ligue"))}
    </div></div>
  <div class="chapcard"><div><small>${T("Chapitre")} ${ch+1}</small><b>${esc(PARC_CH[ch]||'')}</b></div><div class="chprog"><i style="width:${chStars/(PARC_PER*3)*100}%"></i></div><span>⭐ ${tot}/${max}</span></div>
  <div class="lvpath">${html}</div>
  <div class="spacer"></div>
  <div class="playbar"><div class="in"><button class="gobig" type="button" data-act="parc" data-v="${np}">${T("Niveau")} ${np+1} ▶</button></div></div>`;
}

/* ---------- Arène ---------- */

/* ---------- Boutique : carrousel autour de ton pion ; Vestiaire : ce que tu possèdes ---------- */
const SHOP_KINDS=['color','fur','fin','eyes','acc','trail','win','theme'];
const KIND_PL={color:T("Couleur"),fur:T("Forme"),fin:T("Finition"),eyes:T("Yeux"),acc:T("Accessoire"),trail:T("Traînée"),win:T("Célébration"),theme:T("Plateau")};
let SHOP={mode:'shop', k:'color', i:0, dir:0};
const shopList = (k, mode) => Object.keys(CAT[k]).filter(id => mode==='shop' ? (CAT[k][id].p>0 && !unlocked(k,id)) : unlocked(k,id));
const isEq = (k,id) => k==='theme' ? P.theme===id : P.skin[k]===id;
function itemView(k, id, big){
  const it=CAT[k][id];
  if (k==='theme') return `<div class="swatch ${big?'big':''}" style="background:${it.fr}">${[1,2,1,2,1,2,1,2,1].map(v=>`<i style="background:${v===1?it.t1:it.t2}"></i>`).join('')}</div>`;
  if (k==='trail'||k==='win') return `<div class="fxstage ${big?'big':''}">${pawnSVG({...P.skin,[k]:id})}<span class="fxe fx-${k}-${id}">${it.e}</span></div>`;
  return pawnSVG({...P.skin,[k]:id});
}
function renderShop(){
  const mode=SHOP.mode, list=shopList(SHOP.k, mode);
  if (SHOP.i>=list.length) SHOP.i=Math.max(0,list.length-1);
  const id=list[SHOP.i], it=id?CAT[SHOP.k][id]:null, n=list.length;
  const prev=n>1?list[(SHOP.i-1+n)%n]:null, next=n>1?list[(SHOP.i+1)%n]:null;
  const rr=it?rarity(it.p):null, c=it?cost(it.p):0;
  let btn='';
  if (it){
    if (mode==='shop') btn = P.coins>=c ? `<button class="buybtn" type="button" data-act="shop-buy">${T("Acheter")} · ${ic('coin')} ${c}</button>` : `<button class="buybtn poor" type="button" data-act="coins-shop">${ic('coin')} ${c}</button><small class="miss">${T("Il te manque")} ${c-P.coins} ${T("pièces")}</small>`;
    else btn = isEq(SHOP.k,id) ? `<button class="buybtn eq" type="button" disabled>✓ ${T("Équipé")}</button>` : `<button class="buybtn" type="button" data-act="shop-equip">${T("Équiper")}</button>`;
  }
  const cats=SHOP_KINDS.map(k=>{ const L=shopList(k,mode).length; return `<button type="button" class="catb${SHOP.k===k?' on':''}" data-act="shop-cat" data-v="${k}"><span class="cpv">${{color:'🎨',fur:'🔷',fin:'💎',eyes:'👀',acc:'👑',trail:'🌠',win:'🎆',theme:'🟪'}[k]}</span><b>${KIND_PL[k]}</b><small>${mode==='shop'?(L?`${L} ${T("à débloquer")}`:'✓ '+T("tout possédé")):`${L} ${T("possédé(s)")}`}</small></button>`; }).join('');
  return `${pillsTop()}${pageTitle(mode==='shop'?'coffre-or':'icone-profil', mode==='shop'?'🛍️':'👕', mode==='shop'?T("Boutique"):T("Vestiaire"),
      `<button class="pill swap" type="button" data-act="shop-mode">${mode==='shop'?'👕 '+T("Vestiaire"):'🛍️ '+T("Boutique")}</button>`)}
  <div class="stage">
    <div class="stbg"></div>
    ${prev?`<button type="button" class="side l" data-act="shop-prev" aria-label="${T("Précédent")}">${itemView(SHOP.k,prev)}</button>`:''}
    ${next?`<button type="button" class="side r" data-act="shop-next" aria-label="${T("Suivant")}">${itemView(SHOP.k,next)}</button>`:''}
    <div class="center ${SHOP.dir>0?'inR':SHOP.dir<0?'inL':''}" ${SHOP.k==='win'&&id?`data-act="shop-preview"`:''}>${it?itemView(SHOP.k,id,true):`<div class="empty">${mode==='shop'?'✓<small>'+T("Tu as déjà tout dans cette catégorie !")+'</small>':'<small>'+T("Rien ici pour l'instant")+'</small>'}</div>`}</div>
    ${n>1?`<button type="button" class="arw l" data-act="shop-prev" aria-label="${T("Précédent")}">‹</button><button type="button" class="arw r" data-act="shop-next" aria-label="${T("Suivant")}">›</button>`:''}
    <div class="pedestal"></div>
  </div>
  ${it?`<div class="iinfo">${rr?`<span class="rar r-${rr.k}">${rr.n}</span>`:''}<h2>${esc(it.n)}</h2><small>${KIND_PL[SHOP.k]} · ${SHOP.i+1}/${n}${SHOP.k==='win'?' · '+T("touche pour voir"):''}</small>${btn}</div>`:''}
  <div class="cats">${cats}</div>`;
}
let shopTx=null;
document.addEventListener('touchstart', e=>{ shopTx = e.target.closest && e.target.closest('.stage') ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener('touchend', e=>{ if (shopTx==null) return; const dx=e.changedTouches[0].clientX-shopTx; shopTx=null; if (Math.abs(dx)>45) shopMove(dx<0?1:-1); }, {passive:true});
function shopMove(d){ const n=shopList(SHOP.k,SHOP.mode).length; if (n<2) return; SHOP.i=(SHOP.i+d+n)%n; SHOP.dir=d; render(); setTimeout(()=>{ SHOP.dir=0; },400); }
function shopBuy(){
  const id=shopList(SHOP.k,'shop')[SHOP.i]; if (!id) return; const c=cost(CAT[SHOP.k][id].p);
  if (P.coins<c){ sheet={type:'coins'}; render(); return; }
  P.coins-=c; P.owned.push(SHOP.k+':'+id); equip(SHOP.k,id); saveP(); sfx.win(); vibrate([20,40,20]);
  toast(`${CAT[SHOP.k][id].n} : ${T("acheté et équipé !")}`); fxRun('confettis', COLORS[P.skin.color].hex, $('#party').querySelector('canvas')); setTimeout(stopConfetti,2500);
  render();
}
// Achat de pièces : vrai paiement avec l'appli des stores (window.LastepIAP) ; en attendant, une pub = quelques pièces
const PACKS=[{id:'p1',c:500,eur:'0,99 €',img:'coffre-bois'},{id:'p2',c:1500,eur:'2,49 €',img:'coffre-argent',tag:T("Populaire")},{id:'p3',c:4000,eur:'4,99 €',img:'coffre-or',tag:T("Meilleur prix")},{id:'p4',c:10000,eur:'9,99 €',img:'coffre-legendaire'}];
function coinsSheet(){
  const ad=P.adCoins&&P.adCoins.d===dayKey()?P.adCoins.n:0;
  return `<h2>${T("Acheter des pièces")}</h2><p class="sub">${T("Tu as")} <b>${P.coins}</b> ${T("pièces")}.</p>
  <div class="packs">${PACKS.map(k=>`<button type="button" class="pack" data-act="pack" data-v="${k.id}">${k.tag?`<span class="ptag">${k.tag}</span>`:''}${IMG(k.img)}<b>${ic('coin')} ${k.c.toLocaleString(LANG)}</b><span class="eur">${k.eur}</span></button>`).join('')}</div>
  ${ad<5?adBtn('coins-ad', `+25 ${T("pièces")} (${5-ad}/5)`):''}
  <p class="note" style="text-align:center">${T("Les pièces servent uniquement à débloquer des apparences. Elles ne donnent aucun avantage en partie.")}</p>`;
}

  const t=tierOf(P.elo.r), nb=Object.keys(P.badges).length;
  const sec=(id,title,body)=>`<details class="sec2" data-sec="${id}" ${OPEN.has(id)?'open':''}><summary>${title}</summary><div class="in">${body}</div></details>`;

  return `${pillsTop()}
  <div class="prohead">
    <div class="heroz pro"><div class="herop">${pawnSVG(P.skin)}</div><div class="heros"></div></div>

    <div class="chips3"><span style="color:${t[2]}">${t[1]}</span><span>${arenaElo()} ${T("steps")}</span><span>⭐ ${parcTotal()}</span>${P.lg&&P.lg.rank?`<span>🏆 ${P.lg.rank}${LANG==='en'?'.':'e'}</span>`:''}</div>
    <p class="note">${T("Code ami :")} <b>${fmtUid(P.uid)}</b>${P.premium?' · 💎 '+T("Premium"):''}</p>

  </div>
  <div class="stats2">${stat(P.stat.games||0,T("parties"))}${stat(P.elo.g,T("matchs classés"))}${stat(pzDone(),T("puzzles"))}${stat(P.stat.fell||0,T("cases détruites"))}${stat(nb+'/'+BADGES.length,T("badges"))}${stat(streakNow(),T("jours de suite"))}</div>
  ${sec('rank',T("Classements par cadence"), cadHTML())}
  ${sec('badges',`${T("Badges")} · ${nb}/${BADGES.length}`, badgesHTML())}
  ${sec('friends',`${T("Amis")} · ${P.friends.length}`, `${friendsHTML()}<div class="fbtns"><button type="button" data-act="addfriend">${ic('plus')}${T("Ajouter")}</button><button type="button" data-act="contacts">${ic('contacts')}${T("Répertoire")}</button><button type="button" data-act="poster">${ic('image')}${T("Mon poster")}</button></div>`)}
  ${sec('games',`${T("Parties contre de vrais joueurs ·")} ${realGames().length}`, realGames().length?`<div class="list">${realGames().slice(-5).reverse().map(gameRow).join('')}</div><button class="linkbtn" type="button" data-act="games">${T("Tout voir ›")}</button>`:("<p class=\"sub\">"+T("Tes parties en ligne et contre tes amis apparaîtront ici.")+"</p>"))}
  ${sec('set',`⚙️ ${T("Réglages")}`, settingsBody())}
  ${sec('about',T("À propos"), `${installCard()}<p class="note">${T("Lastep ·")} <a href="privacy.html" style="color:inherit">${T("Confidentialité")}</a> · <a href="site/" style="color:inherit">${T("Site")}</a> ${T("· contact :")} ${esc(CONFIG.contact)}</p>`)}`;
}

const backHead = (title, to) => `<div class="pagehead"><button class="iconbtn" type="button" data-act="tab" data-v="${to}" aria-label="${T("Retour")}">${ic('back')}</button><h1 class="logo">${title}</h1>${topRight()}</div>`;

initWorker();
setTimeout(lgSyncSoon, 4000);
if (!P.rules && !new URLSearchParams(location.search).get('join') && !new URLSearchParams(location.search).get('pz') && !new URLSearchParams(location.search).get('dj')){ P.rules=true; saveP(); }
render();
// Code tapé : on rejoint dès le 4e chiffre
document.addEventListener('input', e=>{ if (e.target.id!=='code') return; const v=e.target.value.trim(); if (/^[0-9]{4}$/.test(v) && !net){ e.target.blur(); goOnline(v,false); } });
const QS=new URLSearchParams(location.search), joinCode = QS.get('join');
if (QS.get('ami')){ const id=QS.get('ami'), ok=addFriend(id, QS.get('n')); history.replaceState(null,'',location.pathname);
  if (ok){ toast(`${cleanName(QS.get('n')||(T("Ton ami")))} ${T("ajouté à tes amis")}`); if (!P.refBy){ P.refBy=String(id).toLowerCase(); P.coins=(P.coins||0)+100; saveP(); toast((T("Bienvenue : +100 pièces grâce à ton ami"))); } } }
{ const pz=/^(win1|win2|win3|adv)\.(\d{1,2})$/.exec(QS.get('pz')||''); const tt=Math.max(1,Math.min(999,+QS.get('t')||0));
  if (pz && PUZ[pz[1]][+pz[2]]){ history.replaceState(null,'',location.pathname); P.rules=true; saveP(); sheet={type:'chalin', c:{cat:pz[1], i:+pz[2], t:tt, n:cleanName(QS.get('n')||(T("Ton ami")))}}; view='home'; render(); }
  else if (QS.get('dj')){ history.replaceState(null,'',location.pathname); P.rules=true; saveP(); view='home'; render(); } }
setTimeout(presStart, 600);
{ const r4=QS.get('r4'); if (r4 && /^([0-9]{4}|[a-z0-9]{5})$/i.test(r4)){ history.replaceState(null,'',location.pathname); P.rules=true; setTimeout(()=>window.Party&&Party.joinCode(r4.toLowerCase()),300); } }
if (joinCode && /^([0-9]{4}|[a-z0-9]{5})$/i.test(joinCode)){ history.replaceState(null,'',location.pathname); P.rules=true; goOnline(joinCode.toLowerCase(), false); }
if ('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r=>{ r.update(); document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) r.update(); }); }).catch(()=>{});
  let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (reloaded || (M && G && !M.done)) return; reloaded=true; location.reload(); });
}
