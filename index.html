<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141b18">
<meta name="description" content="Dernier Pas : le jeu de stratégie où les cases s'usent. Bloque ton adversaire, garde toujours un pas d'avance.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dernier Pas">
<meta property="og:title" content="Dernier Pas">
<meta property="og:description" content="Le jeu de stratégie où les cases s'usent. Défie tes amis.">
<meta property="og:image" content="og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dernier Pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout : appli mobile — écrans à onglets (Accueil, Jouer, Boutique, Profil) et écran de partie plein cadre. Thème unique sombre (arène). */
:root{
  --felt:#141b18; --frame:#212b27; --raise:#2a3631; --raise2:#33413b; --line:#34423c; --ink:#ede7d8; --muted:#9ba89f;
  --accent:#ecd59c; --go:#8fd19e; --alert:#ff8a70; --ok:#8fd19e; --prem:#5cb8d6;
  --t1:#ecd59c; --t2:#df9457; --x1:#3a2c10; --x2:#2e1607; --bframe:#212b27;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0;touch-action:manipulation;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html.lock,html.lock body{height:100%;overflow:hidden}
html.lock #app{height:100dvh;box-sizing:border-box;overflow:hidden}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body{background:var(--felt);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
#app.ingame{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px}
#game{position:relative}
#bubbleTop,#bubbleBot{position:absolute;z-index:6;max-width:80%;pointer-events:none}
#bubbleTop{right:0;top:150px}
#bubbleBot{left:0;bottom:150px}
#app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px) rotate(-.6deg)}40%,60%{transform:translateX(9px) rotate(.6deg)}}
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Onglets */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#0f1412;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;background:none;border:0;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] .ic{stroke:var(--accent)}

/* Écrans */
.screen{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px}
.logo{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.h2{margin:4px 0 0;font-size:1.05rem;font-weight:800;letter-spacing:.01em}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.note{margin:0;color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font-size:.82rem;font-weight:600;cursor:pointer}
.pill.prem{border-color:var(--prem);color:var(--prem)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 16px;border-radius:12px;border:0;background:linear-gradient(180deg,#a5e0b1,#7cc28c);color:#10301b;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:inset 0 -4px 0 #0003,0 6px 18px #7cc28c33}
.big small{display:block;font-size:.78rem;font-weight:600;opacity:.75}
.item{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border-radius:12px;border:0;background:var(--raise);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:inset 0 -3px 0 #0003}
.item .ic{width:28px;height:28px;stroke:var(--accent)}
.item .lock{margin-left:4px;font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--prem);border:1px solid var(--prem);padding:1px 6px;border-radius:999px}
.timebtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:12px;border:0;background:var(--raise);font-size:1.15rem;font-weight:600;cursor:pointer}
.timebtn .ic{stroke:#ffd75e;fill:#ffd75e}
.more{align-self:center;background:none;border:0;color:var(--ink);font-weight:600;padding:6px 10px;cursor:pointer}
.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc) 20%,var(--raise)),var(--frame));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 40%,transparent)}
.avatar{width:92px;aspect-ratio:1}
.avatar svg,.av svg{width:100%;height:100%;display:block;overflow:visible}
.hero .nm{font-weight:800;font-size:1.2rem;line-height:1.1}
.hero .elo{font-family:var(--mono);font-weight:600;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .tier{font-weight:800;color:var(--tc)}
.spark{width:100%;height:34px;display:block}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.prow{display:grid;grid-template-columns:24px 40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--raise)}
.prow .rk{font-family:var(--mono);color:var(--muted);font-size:.8rem;text-align:center}
.av{width:40px;aspect-ratio:1}
.prow b{display:block;font-weight:600;line-height:1.2}
.prow small{color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.prow .up{color:var(--ok)}
.mini-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:none;font-size:.82rem;font-weight:600;cursor:pointer}
.example{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}

/* Boutique et profil */
.premium{position:relative;overflow:hidden;padding:18px;border-radius:14px;background:linear-gradient(135deg,#1c7fb0,#0d5679);color:#f2fbff;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 -4px 0 #0003}
.premium h3{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.premium ul{margin:0;padding-left:18px;font-size:.9rem;opacity:.92}
.premium .cta{align-self:flex-start;padding:11px 16px;border-radius:10px;border:0;background:#f2fbff;color:#0d5679;font-weight:800;cursor:pointer}
.premium .gem{position:absolute;right:-10px;top:-10px;width:110px;opacity:.25}
.demo{padding:10px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:12px;background:var(--raise);border:2px solid transparent;cursor:pointer;text-align:center;min-width:0}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .pv{width:62px;aspect-ratio:1}
.card .pv svg{width:100%;height:100%;overflow:visible}
.card b{font-size:.85rem;font-weight:600;line-height:1.1}
.card small{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.card small.own{color:var(--ok)}
.card small.lk{color:var(--prem)}
.swatch{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:54px;padding:3px;border-radius:6px}
.swatch i{aspect-ratio:1;border-radius:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips .card{flex:0 0 92px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--frame);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--raise);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--t2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--raise);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:.75rem}

/* Partie */
#game{display:flex;flex-direction:column;gap:8px}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--raise);font-variant-numeric:tabular-nums}
.scorebar .sd{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;font-weight:600;font-size:.85rem}
.scorebar .sd.r{align-items:flex-end;text-align:right}
.scorebar .nm2{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.scorebar .sd i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.scorebar .sd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scorebar .mid{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.scorebar .mid b{font-family:var(--mono);font-size:1.35rem;font-weight:600}
.scorebar .mid small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.scorebar .pts{font-family:var(--mono);font-size:.72rem;color:var(--accent);flex:none}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gbar .phase{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:var(--raise);cursor:pointer;flex:none}
.strip{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;min-height:52px}
.strip .av{width:44px}
.strip .nm{font-weight:600;line-height:1.15;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.strip .nm small{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:.78rem}
.strip .meta{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.strip .dots{color:var(--pc);letter-spacing:.12em}
.strip .jp{border:1px solid var(--line);border-radius:999px;padding:0 6px}
.strip .jp.on{border-color:var(--pc);color:var(--pc)}
.clock{font-family:var(--mono);font-weight:600;font-size:1.55rem;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:9px;background:#0d1210;color:var(--muted);min-width:92px;text-align:right;transition:background .25s,color .25s}
.clock.on{background:#f2ede1;color:#141b18}
.clock.low{color:var(--alert)}
.clock.on.low{background:var(--alert);color:#2a0f08;animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.7}}
.gstatus{margin:0;min-height:1.4em;text-align:center;color:var(--muted);font-size:.9rem}
.gstatus b{color:var(--ink)}
.gstatus.msg{color:var(--alert)}
.actions{display:flex;justify-content:space-around;gap:4px;padding:6px 0 0;border-top:1px solid var(--line)}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-width:0;padding:7px 2px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer}
.act[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--pc) 22%,transparent)}
.act:disabled{opacity:.35;cursor:default}
.act .badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--alert);color:#2a0f08;font-size:.62rem;font-family:var(--mono);display:grid;place-items:center}
.act.primary{flex:2 1 0;flex-direction:row;justify-content:center;background:linear-gradient(180deg,#a5e0b1,#7cc28c);color:#10301b;font-size:.95rem;font-weight:800}
.bubble{position:relative;align-self:flex-start;max-width:85%;padding:8px 12px;border-radius:12px;background:var(--ink);color:#141b18;font-weight:600;font-size:.9rem;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}
.bubble.bot{align-self:flex-end}

/* Plateau */
.board{position:relative;container-type:inline-size;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;background:var(--bframe);border-radius:12px;box-shadow:inset 0 0 0 1px #ffffff12,0 18px 40px #0006;width:100%;max-width:min(440px, calc(100vh - 360px));max-width:min(440px, calc(100dvh - 360px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));margin:0 auto;box-sizing:border-box}
.board.jolt{animation:jolt .18s}
@keyframes jolt{50%{transform:translateY(3px) scale(.995)}}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:7px;display:grid;place-items:center;font-size:calc(100cqw / 5 * .36)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.cell.hole{background:#080b0a;box-shadow:inset 0 4px 10px #000e}
.cell.v1{background:var(--t1);color:var(--x1)}
.cell.v2{background:var(--t2);color:var(--x2)}
.cell.v1,.cell.v2{box-shadow:inset 0 -4px 0 #0004,inset 0 1px 0 #fff5}
.num{font-weight:800;line-height:1;opacity:.75}
.deal .cell{animation:deal .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.cell.from::after{content:"";position:absolute;inset:38%;border-radius:50%;border:2px solid var(--lc);opacity:.6}
.cell.target{cursor:pointer;outline:3px solid var(--pc);outline-offset:-3px}
.cell.target::before{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--pc);opacity:.7}
.cell.jtarget{cursor:pointer;outline:3px dashed var(--pc);outline-offset:-3px}
.cell.jtarget::before{content:"↷";position:absolute;font-family:var(--mono);font-weight:600;color:var(--pc);font-size:.8em;text-shadow:0 1px 2px #000}
.cell.ptarget{cursor:pointer;outline:2px dashed color-mix(in srgb,var(--mc) 65%,transparent);outline-offset:-4px}
.cell.pre{outline:3px solid var(--mc);outline-offset:-3px}
.cell.hint{outline:3px solid var(--ok);outline-offset:-3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.layer{position:absolute;inset:9px;pointer-events:none}
.pawn,.fx{position:absolute;left:0;top:0;width:calc((100% - 20px) / 5);aspect-ratio:1;transform:translate(calc(var(--q) * (100% + 5px)),calc(var(--r) * (100% + 5px)))}
.pawn{transition:transform .34s cubic-bezier(.3,1.3,.5,1);z-index:2}
.pawn .body{position:absolute;inset:6%;transition:transform .2s,opacity .3s}
.pawn .body svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 3px #000a)}
.pawn .body::before{content:"";position:absolute;inset:4%;border-radius:50%;border:3px solid transparent;transition:border-color .2s}
.pawn.mine .body::before{border-color:color-mix(in srgb,var(--pc) 55%,transparent)}
.pawn.picked .body{transform:translateY(-8%) scale(1.08)}
.pawn.picked .body::before{border-color:var(--pc)}
.pawn.hint .body::before{border-color:var(--ok)}
.pawn.pre .body::before{border-color:var(--mc);border-style:dashed}
.look{transform:translate(calc(var(--lx,0) * 5px),calc(var(--ly,0) * 4px));transition:transform .35s}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pawn.stuck .body{opacity:.6}
.pawn.stuck .eyes{animation:none;transform:scaleY(.15)}
.pawn.win .body{animation:hop .6s ease-in-out 3}
.pawn.lose .body{opacity:.45;transform:scale(.9)}
.pawn.angry .body{animation:wobble .5s 2}
.pawn.laugh .body{animation:hop .35s ease-in-out 4}
.zzz{position:absolute;right:-2%;top:-34%;width:60%;height:60%;display:none;font-weight:800;color:#dfe7ff;text-shadow:0 2px 4px #000;pointer-events:none;z-index:3}
.pawn.sleep .zzz{display:block}
.zzz span{position:absolute;opacity:0;animation:zz 2.4s ease-in infinite}
.zzz span:nth-child(1){font-size:.9em;animation-delay:0s}.zzz span:nth-child(2){font-size:1.15em;animation-delay:.8s}.zzz span:nth-child(3){font-size:1.4em;animation-delay:1.6s}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}20%{opacity:1}100%{opacity:0;transform:translate(18px,-26px)}}
.pawn.sleep .eyes{animation:none;transform:scaleY(.12)}
.pawn.sleep .body{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,.96)}}
.pawn{font-size:calc(100cqw / 5 * .42)}
@keyframes hop{50%{transform:translateY(-16%)}}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.fx.fall{background:var(--t1);border-radius:7px;animation:fall .6s ease-in forwards}
@keyframes fall{to{scale:.2;rotate:25deg;opacity:0}}
.fx.ring{border-radius:50%;box-shadow:0 0 0 3px var(--pc);animation:ring .5s ease-out forwards}
@keyframes ring{from{opacity:.9;scale:.6}to{opacity:0;scale:1.25}}

/* Feuilles (bottom sheets) */
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:#000a;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;max-width:520px;width:100%;margin:0 auto;max-height:88vh;overflow-y:auto;box-sizing:border-box;background:var(--frame);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px #000a;animation:up .28s cubic-bezier(.2,1,.3,1) both}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:1.3rem;font-weight:800}
.sheet p{margin:0;color:var(--muted)}
.primary{padding:14px 16px;border-radius:10px;border:0;background:var(--accent);color:#231a08;font-weight:800;cursor:pointer}
.secondary{padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600;cursor:pointer}
.danger{padding:13px 16px;border-radius:10px;border:1px solid var(--alert);background:none;color:var(--alert);font-weight:600;cursor:pointer}
.bots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bots .card .pv{width:70px}
.timegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.timegrid button{padding:16px 6px;border-radius:10px;border:2px solid transparent;background:var(--raise);font-weight:800;font-size:1.1rem;cursor:pointer}
.timegrid button[aria-pressed="true"]{border-color:var(--accent)}
.joinrow{display:flex;gap:8px}
.code-input{flex:1;min-width:0;font-family:var(--mono);font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--ink)}
.code{font-family:var(--mono);font-weight:600;font-size:2.4rem;letter-spacing:.3em;color:var(--accent);text-align:center;user-select:all}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;padding:4px 0}
.cm{max-width:80%;padding:7px 11px;border-radius:12px;background:var(--raise);font-size:.92rem;align-self:flex-start;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 22%,var(--raise))}
.cm small{display:block;font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.quick button{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:none;font-size:.82rem;cursor:pointer}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--ink)}
.recap{margin:0;padding-left:18px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.recap b{color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.who i{width:11px;height:11px;border-radius:50%;background:var(--pc);flex:none}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:220px;margin:0 auto}
.mini div{position:relative;aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.mini .v1{background:var(--t1);color:var(--x1)}.mini .v2{background:var(--t2);color:var(--x2)}.mini .h{background:#080b0a}
.mini .pw::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--pc);box-shadow:0 1px 3px #000a}
.mini .fr{outline:2px dashed var(--muted);outline-offset:-2px}
.mini .pl{box-shadow:inset 0 0 0 3px var(--alert)}
.mini .bs{box-shadow:inset 0 0 0 3px var(--ok)}
.moves{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.mv{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;text-align:left;font-size:.85rem;padding:7px 9px;border-radius:7px;border:1px solid transparent;background:var(--raise);cursor:pointer}
.mv[aria-current="true"]{border-color:var(--accent)}
.mv .n{font-family:var(--mono);color:var(--muted);font-size:.72rem}
.mv code,p code{font-family:var(--mono);font-size:.82rem}
.badge2{font-family:var(--mono);font-size:.66rem;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge2.blunder{background:color-mix(in srgb,var(--alert) 25%,transparent);color:var(--alert)}
.badge2.mistake{background:color-mix(in srgb,var(--t2) 25%,transparent);color:var(--t2)}
.badge2.win{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.badge2.good{color:var(--muted)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;color:var(--muted);font-size:.92rem}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rules li span{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.85rem}
.rules b{color:var(--ink)}

/* Plein écran : intro, wizz, toast, célébration */
.intro{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.band{width:100%;padding:20px 16px;text-align:center;background:linear-gradient(90deg,transparent,#141b18f0 18%,#141b18f0 82%,transparent);box-shadow:0 1px 0 #ecd59c66,0 -1px 0 #ecd59c66;animation:band 1.9s ease both}
.band .k{font-family:var(--mono);letter-spacing:.35em;color:var(--accent);font-size:.78rem;text-transform:uppercase}
.band .t{font-size:2.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;animation:slide 1.9s ease both}
.band .s{color:var(--muted)}
@keyframes band{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
@keyframes slide{0%{opacity:0;transform:translateX(-40px)}16%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
.fxscreen{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.flash{position:absolute;inset:0;box-shadow:inset 0 0 0 10px var(--pc),inset 0 0 80px var(--pc);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.wword{position:absolute;font-weight:800;font-size:3.4rem;letter-spacing:-.02em;color:var(--pc);text-shadow:0 4px 0 #000,0 0 24px #000;animation:knock .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes knock{0%{transform:scale(.3) rotate(var(--rot));opacity:0}25%{transform:scale(1.15) rotate(var(--rot));opacity:1}70%{opacity:1}100%{transform:scale(1) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#141b18;font-weight:600;font-size:.9rem;box-shadow:0 8px 30px #000a;animation:drop .3s cubic-bezier(.2,1.5,.4,1) both}
html.lock .toast{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.overlay{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:20px;background:#141b18e6;backdrop-filter:blur(3px)}
.overlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--frame);border-radius:16px;padding:24px 20px;max-width:340px;width:100%;box-sizing:border-box;box-shadow:0 0 0 2px var(--pc),0 20px 60px #000c;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.pcard .av{width:110px}
.pcard h2{margin:0;font-size:2.1rem;font-weight:800;color:var(--pc);text-wrap:balance;line-height:1.1}
.pcard .score{margin:0;font-family:var(--mono);font-size:1.5rem;font-weight:600}
.pcard .sub{margin:0;color:var(--muted);font-size:.85rem}
.pcard .quote{margin:0;font-style:italic;color:var(--ink)}
.pcard .row{width:100%}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.primary:focus-visible,.secondary:focus-visible,.danger:focus-visible,.big:focus-visible,.item:focus-visible,.card:focus-visible,.act:focus-visible,.iconbtn:focus-visible,#tabs button:focus-visible,.pill:focus-visible,.mini-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  #app.shake,.band,.band .t,.deal .cell,.fx,.pawn.win .body,.pawn.angry .body,.eyes,.clock.on.low,.cell.hint,.sheet,.scrim,.pcard,.toast,.wword,.flash,.bubble,.board.jolt{animation:none!important}
  .pawn,.look{transition:none}
}

<script>
/* ---------- Réglages de lancement ---------- */
const CONFIG = {
  season0: true,          // Saison 0 : toute la personnalisation est offerte
  supportUrl: '',         // lien de soutien (Stripe Payment Link, Ko-fi…). Vide = bouton masqué
  contact: 'contact@exemple.fr',   // À REMPLACER par l'e-mail de contact que tu veux rendre public
};
const N=5, DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
const START=[[20,24],[4,0]];
const BOARDS=[
 ['Damier','21212 12121 21212 12121 21212'],
 ['Forteresse','22222 21112 21212 21112 22222'],
 ['Rivière','21212 22222 11211 22222 21212'],
 ['Croix','21212 11211 22222 11211 21212'],
 ['Diagonales','21112 12121 11211 12121 21112'],
 ['Couronne','21112 12221 12121 12221 21112'],
 ['Sablier','22222 12221 11211 12221 22222'],
 ['Îlots','22112 22112 11211 21122 21122'],
 ['Moulin','22112 12122 12221 22121 21122'],
 ['Colonnes','21212 21212 21212 21212 21212'],
].map(([name,rows])=>({name, cells:[...rows.replace(/ /g,'')].map(Number)}));
const LEVELS={
  easy:{label:'Facile',elo:800,random:.35,maxDepth:1,budget:120},
  medium:{label:'Moyen',elo:1100,random:0,maxDepth:3,budget:400},
  hard:{label:'Difficile',elo:1400,random:0,maxDepth:30,budget:1200},
  expert:{label:'Expert',elo:1750,random:0,maxDepth:40,budget:3000},
};
const AI_TIMEOUT={};
function aiGen(cells,P,J,t){
  const a=P[0][0],b=P[0][1],c=P[1][0],d=P[1][1],out=[];
  for(let k=0;k<2;k++){
    const pos=P[t][k],r0=(pos/5)|0,q0=pos%5;
    for(let dd=0;dd<4;dd++){
      const dr=DIRS[dd][0],dq=DIRS[dd][1]; let crossed=false;
      for(let s=1;s<=3;s++){
        const r=r0+dr*s,q=q0+dq*s; if(r<0||q<0||r>4||q>4) break;
        const i=r*5+q;
        if(i===a||i===b||i===c||i===d||cells[i]===0){ if(!J[t]) break; crossed=true; continue; }
        out.push([k,i,crossed?1:0]);
      }
    }
  }
  return out;
}
function aiMob(cells,P,t){
  const a=P[0][0],b=P[0][1],c=P[1][0],d=P[1][1]; let n=0;
  for(let k=0;k<2;k++){
    const pos=P[t][k],r0=(pos/5)|0,q0=pos%5;
    for(let dd=0;dd<4;dd++){
      for(let s=1;s<=3;s++){
        const r=r0+DIRS[dd][0]*s,q=q0+DIRS[dd][1]*s; if(r<0||q<0||r>4||q>4) break;
        const i=r*5+q; if(i===a||i===b||i===c||i===d||cells[i]===0) break; n++;
      }
    }
  }
  return n;
}
function aiEval(cells,P,J,t){ return 2*(aiMob(cells,P,t)-aiMob(cells,P,1-t)) + 3*(J[t]-J[1-t]); }
function aiSearch(cells,P,J,t,depth,alpha,beta,deadline){
  if(deadline && performance.now()>deadline) throw AI_TIMEOUT;
  const ms=aiGen(cells,P,J,t);
  if(!ms.length) return -1000-depth;
  if(depth===0) return aiEval(cells,P,J,t);
  let best=-Infinity;
  for(const m of ms){
    const k=m[0],from=P[t][k];
    cells[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
    const v=-aiSearch(cells,P,J,1-t,depth-1,-beta,-alpha,deadline);
    cells[from]++; P[t][k]=from; if(m[2]) J[t]=1;
    if(v>best) best=v; if(v>alpha) alpha=v; if(alpha>=beta) break;
  }
  return best;
}
function aiChoose(st,level){
  const L=LEVELS[level], t=st.turn;
  const snap=()=>[st.cells.slice(), st.pawns.map(p=>p.slice()), st.jumps.slice()];
  let [c,P,J]=snap();
  const ms=aiGen(c,P,J,t);
  if(!ms.length) return null;
  for(let i=ms.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=ms[i]; ms[i]=ms[j]; ms[j]=x; }
  if(Math.random()<L.random) return ms[0];
  const deadline=performance.now()+L.budget; let best=ms[0];
  for(let d=1; d<=L.maxDepth; d++){
    [c,P,J]=snap();
    try{
      let bv=-Infinity,bm=best,alpha=-Infinity;
      for(const m of [best,...ms.filter(x=>x!==best)]){
        const k=m[0],from=P[t][k];
        c[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
        const v=-aiSearch(c,P,J,1-t,d-1,-Infinity,-alpha,deadline);
        c[from]++; P[t][k]=from; if(m[2]) J[t]=1;
        if(v>bv){ bv=v; bm=m; } if(v>alpha) alpha=v;
      }
      best=bm; if(bv>=1000||bv<=-1000) break;
    }catch(e){ if(e!==AI_TIMEOUT) throw e; break; }
  }
  return best;
}
function aiAnalyze(st){
  const t=st.turn,c=st.cells.slice(),P=st.pawns.map(p=>p.slice()),J=st.jumps.slice();
  const ms=aiGen(c,P,J,t); let best=-Infinity,bm=null,played=null;
  for(const m of ms){
    const k=m[0],from=P[t][k];
    c[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
    const v=-aiSearch(c,P,J,1-t,3,-Infinity,Infinity,0);
    c[from]++; P[t][k]=from; if(m[2]) J[t]=1;
    if(v>best){ best=v; bm=m; }
    if(m[0]===st.move[0]&&m[1]===st.move[1]&&m[2]===st.move[2]) played=v;
  }
  return {best,bm,played};
}

};

/* ---------- Profil (enregistré sur cet appareil) ---------- */
const P_KEY='dernier-pas-profil';

  elo:{r:1000,g:0,w:0,hist:[1000]}, sound:true, music:true, chat:true, rules:false, time:5, level:'medium'};
function loadP(){
  let v=null; try { v=JSON.parse(localStorage.getItem(P_KEY)); } catch(e){}
  const p=JSON.parse(JSON.stringify(P0));
  if (v && typeof v==='object'){ Object.assign(p, v); p.skin={...P0.skin, ...(v.skin||{})}; p.elo={...P0.elo, ...(v.elo||{})}; }
  else { try { const old=JSON.parse(localStorage.getItem('dernier-pas-elo')); if (old && typeof old.r==='number') p.elo={r:old.r,g:old.g||0,w:old.w||0,hist:[old.r]}; } catch(e){} }

  if (!THEMES[p.theme]) p.theme='classique';
  if (!Array.isArray(p.an)) p.an=[]; if (!Array.isArray(p.owned)) p.owned=[];

function anRenewH(){ if (!P.an.length) return 0; return Math.max(1, Math.ceil((Math.min(...P.an)+WEEK-Date.now())/3600e3)); }
const TIERS=[[900,'Bronze','#c98a5b'],[1150,'Argent','#c9d1cf'],[1400,'Or','#ecd59c'],[1650,'Platine','#8fd1c9'],[1e9,'Diamant','#9fb6ff']];
const tierOf = r => TIERS.find(t => r < t[0]);
function applyElo(score){
  const opp=LEVELS[vsAI].elo, exp=1/(1+Math.pow(10,(opp-P.elo.r)/400)), K=P.elo.g<20?40:24, d=Math.round(K*(score-exp));

function goOnline(code, host){

  net={code, peer:null, conn:null, seat:host?0:1, seq:0, opp:false, err:''};
  M=null; G=null; view='play'; sheet={type:'friend'}; render();
  let peer;

  net.peer=peer;
  peer.on('open', ()=>{

    render();

    if (net.conn && net.conn.open){ conn.on('open',()=>{ conn.send({t:'full'}); setTimeout(()=>conn.close(),300); }); return; }
    wireConn(conn);
  });
  peer.on('error', err=>{

}

    const lk=LOOK[p][k]; el.style.setProperty('--lx', flipped?-lk.x:lk.x); el.style.setProperty('--ly', flipped?-lk.y:lk.y);
    let cls='pawn'; const mine=myTurn&&p===G.turn;
    if (mine) cls+=' mine';
    if (playing && p===G.turn && G.pick===k && (mine||(vsAI&&p===1))) cls+=' picked';
    if (playing && p===G.turn && !movesFor(p).some(m=>m[0]===k)) cls+=' stuck';
    if (mine && G.hint && G.hint[0]===k) cls+=' hint';
    if (preSeat===p && premove && premove.k===k) cls+=' pre';
    if (G.over) cls+= p===G.winner ? ' win' : ' lose';
    if (asleep(p)) cls+=' sleep';
    if (el.className.replace(' angry','').replace(' laugh','')!==cls) el.className=cls;
  }
  // statut
  const st=$('#gstatus'); let txt='', isMsg=false;
  if (G.over) txt = M.done ? `<b>${esc(S[M.wins[0]===2?0:1].name)}</b> remporte la partie ${Math.max(...M.wins)}-${Math.min(...M.wins)}` : `<b>${esc(S[G.winner].name)}</b> gagne la manche. ${G.msg?esc(G.msg):''}`;
  else if (G.msg){ txt=esc(G.msg); isMsg=true; }
  else if (vsAI && G.turn===1) txt=`${esc(S[1].name)} réfléchit…`;
  else if (!myTurn && (seat===0||seat===1)) txt = premove&&premove.i!=null ? `Prémove prêt : <b>${sq(G.pawns[seat][premove.k])}→${sq(premove.i)}</b>` : premove ? 'Prémove : touche la case visée.' : 'Tour adverse. Tu peux préparer ton coup.';
  else if (!myTurn) txt=`Au tour de <b>${esc(S[G.turn].name)}</b>`;
  else if (G.hinting) txt='Recherche du meilleur coup…';
  else if (G.pick===null) txt = seat===null ? `<b>${esc(S[G.turn].name)}</b> : choisis un pion` : 'À toi : choisis un pion';
  else { const hasJ=pickMoves.some(m=>m[2]); txt = hasJ ? 'Touche une case marquée. ↷ = ton saut, utilisé automatiquement' : 'Touche une case marquée'; }
  st.innerHTML=txt; st.classList.toggle('msg', isMsg);
  renderActions();
}

function analysisHTML(){

  if (AN.res===null) return `${head}<p>Analyse de ${h.length} coups en cours…</p>`;
  if (AN.res==='err'||!h.length) return `${head}<p>${h.length?'L\'analyse n\'a pas pu se faire.':'Aucun coup enregistré sur cet appareil pour cette manche.'}</p>`;
  const cnt=[{blunder:0,mistake:0},{blunder:0,mistake:0}];
  const rows=h.map((e,j)=>{ const a=AN.res[j], jd=judge(a); if (cnt[e.turn][jd.k]!==undefined) cnt[e.turn][jd.k]++;
    return `<button type="button" class="mv" data-act="an-sel" data-v="${j}" aria-current="${AN.sel===j}"><span class="n">${j+1}.</span><span>${who(e.turn)} <code>${sq(e.pawns[e.turn][e.move[0]])}${e.move[2]?'↷':'→'}${sq(e.move[1])}</code></span><span class="badge2 ${jd.k}">${jd.t}</span></button>`; }).join('');
  const e=h[AN.sel], a=AN.res[AN.sel], from=e.pawns[e.turn][e.move[0]];
  const mini=e.cells.map((v,i)=>{ const pw=[0,1].find(p=>e.pawns[p].includes(i)); let c=v===0?'h':'v'+v; if (pw!==undefined) c+=' pw'; if (i===from) c+=' fr'; if (a&&a.bm&&i===a.bm[1]) c+=' bs'; else if (i===e.move[1]) c+=' pl'; return `<div class="${c}" ${pw!==undefined?`style="--pc:${S[pw].hex}"`:''}>${v||''}</div>`; }).join('');
  const same=a&&a.bm&&a.bm[0]===e.move[0]&&a.bm[1]===e.move[1]&&a.bm[2]===e.move[2];
  const best=a&&a.bm&&!same ? ` Meilleur : <code>${sq(e.pawns[e.turn][a.bm[0]])}${a.bm[2]?'↷':'→'}${sq(a.bm[1])}</code>.` : same ? ' C\'était le meilleur coup.' : '';
  return `${head}<p>${[0,1].map(p=>`${who(p)} : ${cnt[p].blunder} grave${cnt[p].blunder>1?'s':''}, ${cnt[p].mistake} imprécision${cnt[p].mistake>1?'s':''}`).join('<br>')}</p>
    <div class="mini">${mini}</div>
    <p>Coup ${AN.sel+1} : ${who(e.turn)} joue <code>${sq(from)}${e.move[2]?'↷':'→'}${sq(e.move[1])}</code>.${best} <span class="badge2 ${judge(a).k}">${judge(a).t}</span></p>
    <div class="row"><button class="secondary" type="button" data-act="an-prev" ${AN.sel?'':'disabled'}>◀ Précédent</button><button class="secondary" type="button" data-act="an-next" ${AN.sel<h.length-1?'':'disabled'}>Suivant ▶</button></div>
    <div class="moves">${rows}</div>
    <p class="note">Rouge : coup joué. Vert : meilleur coup. « Victoire manquée » et « Coup perdant » sont certains, le reste est estimé.</p>`;
}

/* ---------- Rendu général ---------- */
function render(){
  S=sides(); applyTheme();
  const inGame = view==='game' && M && G;
  $('#app').classList.toggle('ingame', !!inGame);
  document.documentElement.classList.toggle('lock', !!inGame);
  $('#game').hidden=!inGame; $('#screen').hidden=!!inGame; $('#tabs').hidden=!!inGame;
  if (inGame) renderGame();
  else {
    if (view==='game') view='play';
    const html = view==='home'?renderHome():view==='shop'?renderShop():view==='profile'?renderProfile():renderPlay();
    if ($('#screen').dataset.v!==view || $('#screen').innerHTML!==html){ $('#screen').innerHTML=html; $('#screen').dataset.v=view; }
    renderTabs();
  }
  renderSheet();
}

/* ---------- Événements ---------- */
function startAI(level, coach){ leaveOnline(); vsAI=level; training=!!coach; startMatch(); }
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); if (!a) return;
  const k=a.dataset.act, v=a.dataset.v;
  switch(k){
    case 'tab': view=v; sheet=null; render(); window.scrollTo(0,0); break;
    case 'more': playMore=!playMore; render(); break;
    case 'time-sheet': sheet={type:'time'}; render(); break;
    case 'time': P.time=+v; saveP(); sheet=null; render(); break;
    case 'quick': startAI(P.level,false); break;
    case 'ai-sheet': sheet={type:'ai'}; render(); break;
    case 'coach': sheet={type:'ai',coach:true}; render(); break;
    case 'level': P.level=v; saveP(); render(); break;
    case 'go-ai': startAI(P.level,false); break;
    case 'go-coach': startAI(P.level,true); break;
    case 'local': leaveOnline(); vsAI=null; training=false; startMatch(); break;
    case 'friend': sheet={type:'friend'}; render(); break;
    case 'tournament': sheet={type:'locked',what:'tournament'}; render(); break;
    case 'host': goOnline(newCode(),true); break;
    case 'leave': leaveOnline(); sheet={type:'friend'}; render(); break;
    case 'share': shareInvite(a); break;
    case 'install': doInstall(); break;
    case 'daily': startDaily(); break;
    case 'support': if (CONFIG.supportUrl) window.open(CONFIG.supportUrl,'_blank','noopener'); break;
    case 'rules': sheet={type:'rules'}; render(); break;
    case 'sheet-close': if (sheet && sheet.type==='rules' && !P.rules){ P.rules=true; saveP(); } if (sheet&&sheet.type==='analysis') AN=null; sheet=null; render(); break;
    case 'menu': sheet={type:'menu'}; render(); break;
    case 'ask-leave': sheet={type:'menu',confirm:true}; render(); break;
    case 'leave-game': leaveGame(); break;
    case 'jump': if (G && G.J[G.turn]){ G.jumpOn=!G.jumpOn; render(); } break;
    case 'hint': hint(); break;
    case 'undo': undo(); break;
    case 'chat': unread=0; sheet={type:'chat'}; render(); break;
    case 'quick-msg': sendChat(v); break;
    case 'wizz': sendWizz('wizz'); break;
    case 'toc': sendWizz('toc'); break;
    case 'haha': sendWizz('haha'); break;
    case 'analyze': analyze(M.rounds.length); break;
    case 'results': sheet={type:'results'}; render(); break;
    case 'next': if (canAct()){ sheet=null; M.round++; M.starter=M.next; startRound(); } break;
    case 'new': if (canAct()){ $('#party').hidden=true; stopConfetti(); sheet=null; startMatch(); } break;
    case 'party-close': $('#party').hidden=true; stopConfetti(); break;
    case 'party-analyze': $('#party').hidden=true; stopConfetti(); analyze(M.rounds.length); break;
    case 'an-sel': AN.sel=+v; render(); break;
    case 'an-prev': AN.sel=Math.max(0,AN.sel-1); render(); break;
    case 'an-next': AN.sel=Math.min((HIST[AN.r]||[]).length-1,AN.sel+1); render(); break;
    case 'prem': P.premium=true; saveP(); toast('Premium simulé activé'); render(); break;
    case 'unprem': P.premium=false; saveP(); render(); break;
    case 'go-shop': sheet=null; if (view==='game') leaveGameSoft(); view='shop'; render(); break;
    case 'buy': if (unlocked(a.dataset.k,v)){ equip(a.dataset.k,v); toast('Équipé'); } else { sheet={type:'buy',k:a.dataset.k,v}; } render(); break;
    case 'equip': if (unlocked(a.dataset.k,v)) equip(a.dataset.k,v); else sheet={type:'buy',k:a.dataset.k,v}; render(); break;
    case 'buy-ok': P.owned.push(sheet.k+':'+sheet.v); equip(sheet.k,sheet.v); saveP(); sheet=null; toast('Acheté (démo) et équipé'); render(); break;
    case 'reset-demo': P.owned=[]; P.premium=false; P.skin={...P.skin}; for (const kk of ['color','fur','eyes','acc']) if (!unlocked(kk,P.skin[kk])) P.skin[kk]=P0.skin[kk]; if (!unlocked('theme',P.theme)) P.theme='classique'; P.an=[]; saveP(); toast('Achats de démo réinitialisés'); render(); break;
  }
});
function leaveGameSoft(){ if (M && M.done) leaveGame(); }
function equip(kind,id){ if (kind==='theme') P.theme=id; else P.skin={...P.skin,[kind]:id}; saveP(); }
document.addEventListener('change', e=>{
  const t=e.target;
  if (t.id==='pname'){ P.name=cleanName(t.value)==='Adversaire'&&!t.value.trim()?'Toi':cleanName(t.value); saveP(); render(); }
  if (t.id==='o-sound'){ P.sound=t.checked; saveP(); if (!P.sound) musicStop(); else if (view==='game' && M) musicStart(); }
  if (t.id==='o-music'){ P.music=t.checked; saveP(); if (P.music && view==='game' && M) musicStart(); else musicStop(); }
  if (t.id==='o-chat'){ P.chat=t.checked; saveP(); }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='joinform'){ const v=($('#code').value||'').trim().toLowerCase(); if (!/^[a-z0-9]{5}$/.test(v)){ $('#join-err').hidden=false; return; } goOnline(v,false); }
  if (e.target.id==='chatform'){ const i=$('#chatin'); sendChat(i.value); i.value=''; i.focus(); }
});

/* ---------- Pendule ---------- */
let lastTick=performance.now(), lastSleep=false;
setInterval(()=>{
  const now=performance.now(), dt=now-lastTick; lastTick=now;
  if (!G || G.over || now<introUntil) return;
  G.clock[G.turn]=Math.max(0,G.clock[G.turn]-dt);
  if (G.clock[G.turn]<=0 && (!online()||G.turn===net.seat)){ G.msg=`Temps écoulé pour ${S[G.turn].name}.`; endRound(1-G.turn); commit(); return; }
  const el=document.getElementById('clk'+G.turn); if (el){ el.textContent=fmt(G.clock[G.turn]); el.classList.toggle('low',G.clock[G.turn]<30000); }
  if (wzLast && now%1000<200) renderActions();
  const sl=asleep(G.turn); if (sl!==lastSleep){ lastSleep=sl; renderGame(); }
},200);


/* ---------- Défi du jour, historique, installation ---------- */
const dayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000) / 864e5);
const dailyBoard = () => dayNum() % BOARDS.length;
const dailyLevel = () => ['medium','hard','medium','expert','hard','medium','hard'][dayNum()%7];
function dailyCard(){
  const d=P.daily||{}, done=d.last===dayKey(), b=BOARDS[dailyBoard()], lv=dailyLevel();
  return `<button class="item" type="button" data-act="daily" style="flex-direction:column;gap:4px;align-items:stretch;text-align:left">
    <span style="display:flex;align-items:center;gap:10px">${ic('trophy')}Défi du jour ${d.streak?`<span class="lock" style="color:var(--accent);border-color:var(--accent)">série ${d.streak} j</span>`:''}</span>
    <span class="sub" style="font-weight:500">${done?'Relevé aujourd\'hui. Reviens demain pour prolonger ta série.':`Bats ${BOTS[lv].name} (${LEVELS[lv].label}) sur le plateau ${b.name}.`}</span></button>`;
}
function startDaily(){ leaveOnline(); vsAI=dailyLevel(); training=false; dailyNext=true; startMatch(); }
function recordGame(){
  if (!M || !M.done) return;
  const me=humanSeat(); if (me===-1) return;
  const c=M.wins[0]===2?0:1, w=me===null ? null : me===c;
  if (w===null) return;
  const op=S[me===0?1:0];
  P.games=[...(P.games||[]), {op:op.name, sk:op.skin, w, sc:`${M.wins[me]}-${M.wins[1-me]}`, d:new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short'}), de:M.eloDelta}].slice(-20);
  if (M.daily && w){ const d=P.daily||{}, today=dayKey(), y=new Date(); y.setDate(y.getDate()-1); if (d.last!==today){ P.daily={last:today, streak: d.last===dayKey(y) ? (d.streak||0)+1 : 1}; } }
  saveP();
}
let installEvt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; if (view!=='game') render(); });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard(){
  if (standalone()) return '';
  if (installEvt) return `<button class="item" type="button" data-act="install">${ic('phone')}Installer l'appli</button>`;
  if (isIOS()) return `<p class="demo">Pour installer l'appli sur iPhone : touche Partager dans Safari, puis « Sur l'écran d'accueil ».</p>`;
  return '';
}
async function doInstall(){ if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt=null; render(); }

/* ---------- Célébration ---------- */
let raf=null;
function stopConfetti(){ if (raf) cancelAnimationFrame(raf); raf=null; }
function celebrate(){
  if (!M || !M.done || view!=='game') return;
  recordGame();
  const c=M.wins[0]===2?0:1, me=humanSeat(), iWon = me===null ? true : me===c, box=$('#party');
  box.style.setProperty('--pc', S[c].hex);
  const title = me===null ? `${esc(S[c].name)} gagne !` : iWon ? 'Tu gagnes !' : `${esc(S[c].name)} gagne`;
  const quote = vsAI ? BOTS[vsAI][iWon?'lose':'win'][0] : '';
  $('#partyCard').innerHTML=`<div class="av">${pawnSVG(S[c].skin,S[c].hex)}</div><h2>${title}</h2><p class="score">${M.wins[c]} – ${M.wins[1-c]}</p>
    ${vsAI&&M.eloDelta!=null?`<p class="sub">Elo ${P.elo.r} (${M.eloDelta>=0?'+':''}${M.eloDelta}) · ${tierOf(P.elo.r)[1]}</p>`:''}
    ${quote?`<p class="quote">« ${esc(quote)} » — ${esc(S[1].name)}</p>`:''}
    <div class="row">${canAct()?`<button class="primary" type="button" data-act="new">Rejouer</button>`:''}<button class="secondary" type="button" data-act="party-analyze">Analyser</button></div>
    <button class="secondary" type="button" data-act="leave-game" style="width:100%">${online()?'Quitter':'Retour au menu'}</button>`;
  box.hidden=false;
  if (iWon) sfx.win(); else sfx.round();
  if (REDUCED || !iWon) return;
  const cv=box.querySelector('canvas'), ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1, W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  const cols=[S[c].hex,'#ecd59c','#df9457','#ffffff'];
  const parts=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.38,vx:(Math.random()-.5)*14*dpr,vy:(-6-Math.random()*12)*dpr,s:(5+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now(); stopConfetti();
  const step=t=>{ ctx.clearRect(0,0,W,H); for (const p of parts){ p.vy+=.35*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); } if (t-t0<5000) raf=requestAnimationFrame(step); else { ctx.clearRect(0,0,W,H); raf=null; } };
  raf=requestAnimationFrame(step);
}

initWorker();
if (!P.rules) sheet={type:'rules'};
render();
const joinCode = new URLSearchParams(location.search).get('join');
if (joinCode && /^[a-z0-9]{5}$/i.test(joinCode)){ history.replaceState(null,'',location.pathname); P.rules=true; goOnline(joinCode.toLowerCase(), false); }
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
