<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="description" content="Lastep : le jeu de stratégie où les cases s'usent. Bloque ton adversaire, garde toujours un pas d'avance.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lastep">
<meta property="og:title" content="Lastep">
<meta property="og:description" content="Le jeu de stratégie où les cases s'usent. Défie tes amis.">
<meta property="og:image" content="og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lastep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout : appli mobile — écrans à onglets (Accueil, Jouer, Boutique, Profil) et écran de partie plein cadre. Thème unique sombre (arène). */
:root{
  --felt:#141b18; --frame:#212b27; --raise:#2a3631; --raise2:#33413b; --line:#34423c; --ink:#ede7d8; --muted:#9ba89f;
  --accent:#ecd59c; --go:#8fd19e; --alert:#ff8a70; --ok:#8fd19e; --prem:#5cb8d6;
  --t1:#ecd59c; --t2:#df9457; --x1:#3a2c10; --x2:#2e1607; --bframe:#212b27;
  --display:"Nunito","Avenir Next",system-ui,sans-serif; --fun:"Lilita One","Nunito",system-ui,sans-serif;
  --mono:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0;touch-action:manipulation;overscroll-behavior:none}
html{min-height:calc(100% + env(safe-area-inset-top,0px));background:#07060f}
html.calm{background:#16181d}
body{min-height:100vh;min-height:100dvh}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
html.lock,html.lock body{height:100%;overflow:hidden}
html.lock{min-height:0}
html.lock body{padding-top:0}
html.lock #app{height:var(--apph,100dvh);box-sizing:border-box;overflow:hidden}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
body{background:var(--felt);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
#app.ingame{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-top:calc(8px + env(safe-area-inset-top,0px))}
#game{position:relative}
#bubbleTop,#bubbleBot{position:absolute;z-index:6;max-width:80%;pointer-events:none}
#bubbleTop{right:0;top:150px}
#bubbleBot{left:0;bottom:150px}
#app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px) rotate(-.6deg)}40%,60%{transform:translateX(9px) rotate(.6deg)}}
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Onglets */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#0f1412;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;background:none;border:0;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] .ic{stroke:var(--accent)}

/* Écrans */
.screen{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px}
.logo{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.logo span{color:var(--accent)}
.h2{margin:4px 0 0;font-size:1.05rem;font-weight:800;letter-spacing:.01em}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.note{margin:0;color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font-size:.82rem;font-weight:600;cursor:pointer}
.pill.prem{border-color:var(--prem);color:var(--prem)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 16px;border-radius:12px;border:0;background:linear-gradient(180deg,#a5e0b1,#7cc28c);color:#10301b;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:inset 0 -4px 0 #0003,0 6px 18px #7cc28c33}
.big small{display:block;font-size:.78rem;font-weight:600;opacity:.75}
.item{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border-radius:12px;border:0;background:var(--raise);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:inset 0 -3px 0 #0003}
.item .ic{width:28px;height:28px;stroke:var(--accent)}
.item .lock{margin-left:4px;font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--prem);border:1px solid var(--prem);padding:1px 6px;border-radius:999px}
.timebtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:12px;border:0;background:var(--raise);font-size:1.15rem;font-weight:600;cursor:pointer}
.timebtn .ic{stroke:#ffd75e;fill:#ffd75e}
.more{align-self:center;background:none;border:0;color:var(--ink);font-weight:600;padding:6px 10px;cursor:pointer}
.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(130deg,color-mix(in srgb,var(--tc) 20%,var(--raise)),var(--frame));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 40%,transparent)}
.avatar{width:92px;aspect-ratio:1}
.avatar svg,.av svg{width:100%;height:100%;display:block;overflow:visible}
.hero .nm{font-weight:800;font-size:1.2rem;line-height:1.1}
.hero .elo{font-family:var(--mono);font-weight:600;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .tier{font-weight:800;color:var(--tc)}
.spark{width:100%;height:34px;display:block}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.prow{display:grid;grid-template-columns:24px 40px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--raise)}
.prow .rk{font-family:var(--mono);color:var(--muted);font-size:.8rem;text-align:center}
.av{width:40px;aspect-ratio:1}
.prow b{display:block;font-weight:600;line-height:1.2}
.prow small{color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.prow .up{color:var(--ok)}
.mini-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:none;font-size:.82rem;font-weight:600;cursor:pointer}
.example{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}

/* Boutique et profil */
.premium{position:relative;overflow:hidden;padding:18px;border-radius:14px;background:linear-gradient(135deg,#1c7fb0,#0d5679);color:#f2fbff;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 -4px 0 #0003}
.premium h3{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.premium ul{margin:0;padding-left:18px;font-size:.9rem;opacity:.92}
.premium .cta{align-self:flex-start;padding:11px 16px;border-radius:10px;border:0;background:#f2fbff;color:#0d5679;font-weight:800;cursor:pointer}
.premium .gem{position:absolute;right:-10px;top:-10px;width:110px;opacity:.25}
.demo{padding:10px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:12px;background:var(--raise);border:2px solid transparent;cursor:pointer;text-align:center;min-width:0}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .pv{width:62px;aspect-ratio:1}
.card .pv svg{width:100%;height:100%;overflow:visible}
.card b{font-size:.85rem;font-weight:600;line-height:1.1}
.card small{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.card small.own{color:var(--ok)}
.card small.lk{color:var(--prem)}
.card{position:relative}
.card.r-rare{background:linear-gradient(180deg,#123a5c55,var(--raise) 60%);box-shadow:inset 0 0 0 1px #4fb3ff66}
.card.r-epic{background:linear-gradient(180deg,#5a1f8a66,var(--raise) 60%);box-shadow:inset 0 0 0 1px #b36bff88,0 0 12px #b36bff33}
.card.r-leg{background:linear-gradient(180deg,#8a5a0f77,var(--raise) 60%);box-shadow:inset 0 0 0 1px #ffd75eaa,0 0 16px #ffd75e44}
.card .rar{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#0008}
.card.r-rare .rar{color:#4fb3ff}.card.r-epic .rar{color:#c99bff}.card.r-leg .rar{color:#ffd75e}
.card .pv{width:70px}
.fxpv{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#2c2558,#0d0b1f 70%);box-shadow:inset 0 0 0 1px #ffffff1a}
.fxpv span{font-size:2rem;filter:drop-shadow(0 0 8px #fff8)}
.card.r-leg .fxpv span,.card.r-epic .fxpv span{animation:fxpulse 1.6s ease-in-out infinite}
@keyframes fxpulse{50%{transform:scale(1.18) rotate(-8deg)}}
.fx.tr{display:grid;place-items:center;overflow:visible}
.fx.tr i{position:absolute;left:50%;top:50%;width:var(--s,10px);height:var(--s,10px);border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);translate:calc(-50% + var(--dx,0px)) calc(-50% + var(--dy,0px));animation:trp .75s ease-out forwards}
.fx.tr.flammes i{border-radius:50% 50% 50% 0;rotate:-45deg;animation:trf .8s ease-out forwards}
.fx.tr.galaxie i{border-radius:2px;rotate:45deg;width:calc(var(--s) * .7);height:calc(var(--s) * .7)}
@keyframes trp{from{opacity:1;scale:1}to{opacity:0;scale:.2}}
@keyframes trf{from{opacity:1;scale:1}to{opacity:0;scale:.3;translate:calc(-50% + var(--dx,0px)) calc(-50% + var(--dy,0px) - 26px)}}
.swatch{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:54px;padding:3px;border-radius:6px}
.swatch i{aspect-ratio:1;border-radius:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips .card{flex:0 0 92px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--frame);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--raise);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--t2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--raise);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:.75rem}

/* Partie */
#game{display:flex;flex-direction:column;gap:8px}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--raise);font-variant-numeric:tabular-nums}
.scorebar .sd{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;font-weight:600;font-size:.85rem}
.scorebar .sd.r{align-items:flex-end;text-align:right}
.scorebar .nm2{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.scorebar .sd i{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.scorebar .sd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scorebar .mid{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.scorebar .mid b{font-family:var(--mono);font-size:1.35rem;font-weight:600}
.scorebar .mid small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.scorebar .pts{font-family:var(--mono);font-size:.72rem;color:var(--accent);flex:none}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gbar .phase{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:var(--raise);cursor:pointer;flex:none}
.strip{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;min-height:52px}
.strip .av{width:44px}
.strip .nm{font-weight:600;line-height:1.15;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.strip .nm small{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:.78rem}
.strip .meta{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.strip .dots{color:var(--pc);letter-spacing:.12em}
.strip .jp{border:1px solid var(--line);border-radius:999px;padding:0 6px}
.strip .jp.on{border-color:var(--pc);color:var(--pc)}
.clock{font-family:var(--mono);font-weight:600;font-size:1.55rem;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:9px;background:#0d1210;color:var(--muted);min-width:92px;text-align:right;transition:background .25s,color .25s}
.clock.on{background:#f2ede1;color:#141b18}
.clock.low{color:var(--alert)}
.clock.on.low{background:var(--alert);color:#2a0f08;animation:tick 1s steps(2) infinite}
@keyframes tick{50%{opacity:.7}}
.gstatus{margin:0;min-height:1.4em;text-align:center;color:var(--muted);font-size:.9rem}
.gstatus b{color:var(--ink)}
.gstatus.msg{color:var(--alert)}
.actions{display:flex;justify-content:space-around;gap:4px;padding:6px 0 0;border-top:1px solid var(--line)}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 0;min-width:0;padding:7px 2px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer}
.act[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--pc) 22%,transparent)}
.act:disabled{opacity:.35;cursor:default}
.act .badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--alert);color:#2a0f08;font-size:.62rem;font-family:var(--mono);display:grid;place-items:center}
.act.primary{flex:2 1 0;flex-direction:row;justify-content:center;background:linear-gradient(180deg,#a5e0b1,#7cc28c);color:#10301b;font-size:.95rem;font-weight:800}
.bubble{position:relative;align-self:flex-start;max-width:85%;padding:8px 12px;border-radius:12px;background:var(--ink);color:#141b18;font-weight:600;font-size:.9rem;animation:pop .3s cubic-bezier(.2,1.5,.4,1) both}
.bubble.bot{align-self:flex-end}

/* Plateau */
.board{position:relative;container-type:inline-size;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px 9px 22px 22px;background:var(--bframe);border-radius:12px;box-shadow:inset 0 0 0 1px #ffffff12,0 18px 40px #0006;width:100%;max-width:min(100%, calc(100dvh - 330px));margin:0 auto;box-sizing:border-box}
.board.jolt{animation:jolt .18s}
@keyframes jolt{50%{transform:translateY(3px) scale(.995)}}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:7px;display:grid;place-items:center;font-size:calc(100cqw / 5 * .36)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.cell.hole{background:#080b0a;box-shadow:inset 0 4px 10px #000e}
.cell.v1{background:var(--t1);color:var(--x1)}
.cell.v2{background:var(--t2);color:var(--x2)}
.cell.v1,.cell.v2{box-shadow:inset 0 -4px 0 #0004,inset 0 1px 0 #fff5}
.num{font-weight:800;line-height:1;opacity:.75}
.deal .cell{animation:deal .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
@keyframes deal{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.cell.from::after{content:"";position:absolute;inset:38%;border-radius:50%;border:2px solid var(--lc);opacity:.6}
.cell.target{cursor:pointer;outline:3px solid var(--pc);outline-offset:-3px}
.cell.target::before{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--pc);opacity:.7}
.cell.jtarget{cursor:pointer;outline:3px dashed var(--pc);outline-offset:-3px}
.cell.jtarget::before{content:"↷";position:absolute;font-family:var(--mono);font-weight:600;color:var(--pc);font-size:.8em;text-shadow:0 1px 2px #000}
.cell.ptarget{cursor:pointer;outline:2px dashed color-mix(in srgb,var(--mc) 65%,transparent);outline-offset:-4px}
.cell.pre{outline:3px solid var(--mc);outline-offset:-3px}
.cell.hint{outline:3px solid var(--ok);outline-offset:-3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.layer{position:absolute;inset:9px 9px 22px 22px;pointer-events:none}
.coord{position:absolute;font-family:var(--mono);font-size:.68rem;font-weight:600;color:#c9c2f0;opacity:.85;pointer-events:none;text-shadow:0 0 6px #8f7bff;transform:translate(-50%,-50%)}
.cell.goal{outline:3px solid #ffe14d;outline-offset:-3px;box-shadow:0 0 18px #ffe14d,inset 0 0 14px #ffe14d88!important;animation:pulse 1.1s ease-in-out infinite}
.mini{grid-template-columns:16px repeat(5,1fr)!important;max-width:250px!important}
.mini .lb{aspect-ratio:auto!important;font-family:var(--mono);font-size:.66rem;font-weight:600;color:#c9c2f0;background:none!important;box-shadow:none!important}
.mini .pl{box-shadow:inset 0 0 0 3px var(--alert),0 0 12px var(--alert)!important}
.mini .bs{box-shadow:inset 0 0 0 3px var(--ok),0 0 12px var(--ok)!important}
.sqp{color:var(--alert);font-weight:700}.sqb{color:var(--ok);font-weight:700}
.tr-explain{background:#15112d;border:1px solid #8f7bff66;border-radius:10px;padding:10px 12px;color:#e6e1ff;font-size:.92rem}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;border:1px solid #2ef2ff40;background:#15112d;color:#fff;cursor:pointer}
.lesson .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;border:2px solid var(--accent);color:var(--accent);box-shadow:0 0 10px #2ef2ff66}
.lesson.done .no{background:var(--accent);color:#0a0718}
.lesson small{display:block;color:var(--muted);font-size:.8rem}
.lesson[disabled]{opacity:.55;cursor:default;border-color:#8f7bff44}
.lesson .tag{font-family:var(--mono);font-size:.66rem;color:var(--neon2);border:1px solid var(--neon2);border-radius:999px;padding:1px 7px}
.pzgrid{display:flex;flex-wrap:wrap;gap:6px}
.pzgrid button{width:44px;height:44px;border-radius:10px;border:1px solid #2ef2ff55;background:#15112d;color:#fff;font-family:var(--mono);font-weight:600;cursor:pointer}
.pzgrid button.ok{background:var(--accent);color:#0a0718;box-shadow:0 0 10px #2ef2ff88}
.ratings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.ratings th,.ratings td{padding:8px 6px;border-bottom:1px solid #2c2558;text-align:center}
.ratings th{color:var(--muted);font-weight:600;font-size:.78rem}
.ratings td:first-child,.ratings th:first-child{text-align:left}
.ratings b{font-family:var(--mono);color:#fff}
.ratings .cur td{background:#2ef2ff14}
.pawn,.fx{position:absolute;left:0;top:0;width:calc((100% - 20px) / 5);aspect-ratio:1;transform:translate(calc(var(--q) * (100% + 5px)),calc(var(--r) * (100% + 5px)))}
.pawn{transition:transform .34s cubic-bezier(.3,1.3,.5,1);z-index:2}
.pawn .body{position:absolute;inset:6%;transition:transform .2s,opacity .3s}
.pawn .body svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 3px #000a)}
.pawn .body::before{content:"";position:absolute;inset:4%;border-radius:50%;border:3px solid transparent;transition:border-color .2s}
.pawn.mine .body::before{border-color:color-mix(in srgb,var(--pc) 55%,transparent)}
.pawn.picked .body{transform:translateY(-8%) scale(1.08)}
.pawn.picked .body::before{border-color:var(--pc)}
.pawn.hint .body::before{border-color:var(--ok)}
.pawn.pre .body::before{border-color:var(--mc);border-style:dashed}
.look{transform:translate(calc(var(--lx,0) * 5px),calc(var(--ly,0) * 4px));transition:transform .35s}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pawn.stuck .body{opacity:.6}
.pawn.stuck .eyes{animation:none;transform:scaleY(.15)}
.pawn.win .body{animation:hop .6s ease-in-out 3}
.pawn.lose .body{opacity:.45;transform:scale(.9)}
.pawn.angry .body{animation:wobble .5s 2}
.pawn.laugh .body{animation:hop .35s ease-in-out 4}
.zzz{position:absolute;right:-2%;top:-34%;width:60%;height:60%;display:none;font-weight:800;color:#dfe7ff;text-shadow:0 2px 4px #000;pointer-events:none;z-index:3}
.pawn.sleep .zzz{display:block}
.zzz span{position:absolute;opacity:0;animation:zz 2.4s ease-in infinite}
.zzz span:nth-child(1){font-size:.9em;animation-delay:0s}.zzz span:nth-child(2){font-size:1.15em;animation-delay:.8s}.zzz span:nth-child(3){font-size:1.4em;animation-delay:1.6s}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}20%{opacity:1}100%{opacity:0;transform:translate(18px,-26px)}}
.pawn.sleep .eyes{animation:none;transform:scaleY(.12)}
.pawn.sleep .body{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05,.96)}}
.pawn{font-size:calc(100cqw / 5 * .42)}
@keyframes hop{50%{transform:translateY(-16%)}}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.fx.fall{background:var(--t1);border-radius:7px;animation:fall .6s ease-in forwards}
@keyframes fall{to{scale:.2;rotate:25deg;opacity:0}}
.fx.ring{border-radius:50%;box-shadow:0 0 0 3px var(--pc);animation:ring .5s ease-out forwards}
@keyframes ring{from{opacity:.9;scale:.6}to{opacity:0;scale:1.25}}

/* Feuilles (bottom sheets) */
.sheetwrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:#000a;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;max-width:520px;width:100%;margin:0 auto;max-height:88vh;overflow-y:auto;box-sizing:border-box;background:var(--frame);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px #000a;animation:up .28s cubic-bezier(.2,1,.3,1) both}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:1.3rem;font-weight:800}
.sheet p{margin:0;color:var(--muted)}
.primary{padding:14px 16px;border-radius:10px;border:0;background:var(--accent);color:#231a08;font-weight:800;cursor:pointer}
.secondary{padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600;cursor:pointer}
.danger{padding:13px 16px;border-radius:10px;border:1px solid var(--alert);background:none;color:var(--alert);font-weight:600;cursor:pointer}
.bots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bots .card .pv{width:52px}
.bots .card small{font-size:.72rem}
.timegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.timegrid button{padding:16px 6px;border-radius:10px;border:2px solid transparent;background:var(--raise);font-weight:800;font-size:1.1rem;cursor:pointer}
.timegrid button[aria-pressed="true"]{border-color:var(--accent)}
.timegrid.t3{grid-template-columns:repeat(3,1fr)}.timegrid.t3 button{padding:12px 4px;font-size:.95rem}
.joinrow{display:flex;gap:8px}
.code-input{flex:1;min-width:0;font-family:var(--mono);font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--ink)}
.code{font-family:var(--mono);font-weight:600;font-size:2.4rem;letter-spacing:.3em;color:var(--accent);text-align:center;user-select:all}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;padding:4px 0}
.cm{max-width:80%;padding:7px 11px;border-radius:12px;background:var(--raise);font-size:.92rem;align-self:flex-start;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 22%,var(--raise))}
.cm small{display:block;font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.langsel{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--felt,#15112d);color:inherit}
.newtag{margin-left:auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;padding:3px 7px;border-radius:999px;background:#ff3dd8;color:#0a0718;box-shadow:0 0 10px #ff3dd8}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:#0d0b1f;margin:6px 0 10px}
.seg button{flex:1;padding:10px;border-radius:10px;border:0;background:none;color:var(--muted);font:inherit;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid button{padding:13px 12px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:inherit;font:inherit;font-size:.9rem;text-align:left;line-height:1.2;min-height:52px}
.qgrid button:active{transform:scale(.97);border-color:var(--accent)}
.lastmsg{margin:0 0 4px;padding:10px 12px;border-radius:12px;background:#0d0b1f;font-size:.95rem}.lastmsg small{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.fc .bonus{display:inline-flex;align-items:center;gap:3px;color:var(--neon3,#b6ff3b);font-family:var(--mono);font-weight:600}.fc .bonus svg{width:14px;height:14px}
.phl{margin:10px 0 4px;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phc{font-family:var(--mono);font-size:.85rem;color:var(--neon1,#2ef2ff);margin-left:6px}
.phgrid{display:flex;flex-wrap:wrap;gap:8px;max-height:46vh;overflow-y:auto}
.phgrid button{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:.85rem;text-align:left;cursor:pointer}
.phgrid button[aria-pressed="true"]{border-color:#ff3dd8;background:#ff3dd822;box-shadow:0 0 12px #ff3dd866}
.quick button{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:none;font-size:.82rem;cursor:pointer}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--ink)}
.recap{margin:0;padding-left:18px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.recap b{color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.who i{width:11px;height:11px;border-radius:50%;background:var(--pc);flex:none}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:100%;max-width:220px;margin:0 auto}
.mini div{position:relative;aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.mini .v1{background:var(--t1);color:var(--x1)}.mini .v2{background:var(--t2);color:var(--x2)}.mini .h{background:#080b0a}
.mini .pw::after{content:"";position:absolute;inset:18%;border-radius:50%;background:var(--pc);box-shadow:0 1px 3px #000a}
.mini .fr{outline:2px dashed var(--muted);outline-offset:-2px}
.mini .pl{box-shadow:inset 0 0 0 3px var(--alert)}
.mini .bs{box-shadow:inset 0 0 0 3px var(--ok)}
.moves{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.mv{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;text-align:left;font-size:.85rem;padding:7px 9px;border-radius:7px;border:1px solid transparent;background:var(--raise);cursor:pointer}
.mv[aria-current="true"]{border-color:var(--accent)}
.mv .n{font-family:var(--mono);color:var(--muted);font-size:.72rem}
.mv code,p code{font-family:var(--mono);font-size:.82rem}
.badge2{font-family:var(--mono);font-size:.66rem;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge2.blunder{background:color-mix(in srgb,var(--alert) 25%,transparent);color:var(--alert)}
.badge2.mistake{background:color-mix(in srgb,var(--t2) 25%,transparent);color:var(--t2)}
.badge2.win{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.badge2.good{color:var(--muted)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;color:var(--muted);font-size:.92rem}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.rules li span{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.85rem}
.rules b{color:var(--ink)}

/* Plein écran : intro, wizz, toast, célébration */
.intro{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.band{width:100%;padding:20px 16px;text-align:center;background:linear-gradient(90deg,transparent,#141b18f0 18%,#141b18f0 82%,transparent);box-shadow:0 1px 0 #ecd59c66,0 -1px 0 #ecd59c66;animation:band 1.2s ease both}
.band .k{font-family:var(--mono);letter-spacing:.35em;color:var(--accent);font-size:.78rem;text-transform:uppercase}
.band .t{font-size:2.8rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;animation:slide 1.2s ease both}
.band .s{color:var(--muted)}
@keyframes band{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
@keyframes slide{0%{opacity:0;transform:translateX(-40px)}16%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
.fxscreen{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.flash{position:absolute;inset:0;box-shadow:inset 0 0 0 10px var(--pc),inset 0 0 80px var(--pc);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.wword{position:absolute;font-weight:800;font-size:3.4rem;letter-spacing:-.02em;color:var(--pc);text-shadow:0 4px 0 #000,0 0 24px #000;animation:knock .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes knock{0%{transform:scale(.3) rotate(var(--rot));opacity:0}25%{transform:scale(1.15) rotate(var(--rot));opacity:1}70%{opacity:1}100%{transform:scale(1) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#141b18;font-weight:600;font-size:.9rem;box-shadow:0 8px 30px #000a;animation:drop .3s cubic-bezier(.2,1.5,.4,1) both}
html.lock .toast{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#sheet:not([hidden]) ~ .toast{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.overlay{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:20px;background:#141b18e6;backdrop-filter:blur(3px)}
.overlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--frame);border-radius:16px;padding:24px 20px;max-width:340px;width:100%;box-sizing:border-box;box-shadow:0 0 0 2px var(--pc),0 20px 60px #000c;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.pcard .av{width:110px}
.pcard h2{margin:0;font-size:2.1rem;font-weight:800;color:var(--pc);text-wrap:balance;line-height:1.1}
.pcard .score{margin:0;font-family:var(--mono);font-size:1.5rem;font-weight:600}
.pcard .sub{margin:0;color:var(--muted);font-size:.85rem}
.pcard .quote{margin:0;font-style:italic;color:var(--ink)}
.pcard .row{width:100%}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.primary:focus-visible,.secondary:focus-visible,.danger:focus-visible,.big:focus-visible,.item:focus-visible,.card:focus-visible,.act:focus-visible,.iconbtn:focus-visible,#tabs button:focus-visible,.pill:focus-visible,.mini-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  #app.shake,.band,.band .t,.deal .cell,.fx,.pawn.win .body,.pawn.angry .body,.eyes,.clock.on.low,.cell.hint,.sheet,.scrim,.pcard,.toast,.wword,.flash,.bubble,.board.jolt{animation:none!important}
  .pawn,.look{transition:none}
}

/* ===== Habillage néon ===== */
:root{
  --felt:#07060f; --frame:#110e24; --raise:#18143099; --raise2:#221c44; --line:#2c2558; --ink:#f3f0ff; --muted:#a39cd0;
  --accent:#2ef2ff; --neon2:#ff3dd8; --neon3:#b6ff3b; --go:#b6ff3b; --alert:#ff4f6d; --ok:#4dffb0; --prem:#8f7bff;
  color-scheme:dark;
}
body{background:
  radial-gradient(60% 40% at 0% 0%, #ff3dd833, transparent 70%),
  radial-gradient(60% 45% at 100% 100%, #2ef2ff2e, transparent 70%),
  radial-gradient(80% 50% at 50% 50%, #3b1d7a22, transparent 80%),
  linear-gradient(#ffffff06 1px, transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg, #ffffff06 1px, transparent 1px) 0 0/28px 28px,
  #07060f; background-attachment:fixed; color:var(--ink)}
.logo{color:#fff;text-shadow:0 0 6px #fff8,0 0 18px #2ef2ff99}
.logo span{color:var(--neon2);text-shadow:0 0 8px var(--neon2),0 0 22px #ff3dd8aa}
.h2{color:#fff;text-shadow:0 0 10px #8f7bff66}
.sub,.note{color:var(--muted)}
.big{background:linear-gradient(90deg,#2ef2ff,#ff3dd8);color:#0a0718;box-shadow:0 0 0 1px #ffffff40 inset,0 0 18px #2ef2ff88,0 0 36px #ff3dd855;text-shadow:none}
.big small{color:#0a0718}
.item,.timebtn{background:linear-gradient(180deg,#1b1638,#120f27);border:1px solid #2ef2ff40;box-shadow:0 0 14px #2ef2ff1f,inset 0 0 18px #2ef2ff12;color:#fff}
.item .ic{stroke:var(--accent);filter:drop-shadow(0 0 4px #2ef2ff)}
.item .lock,.pill.prem{color:var(--neon2);border-color:var(--neon2);box-shadow:0 0 10px #ff3dd855}
.timebtn .ic{stroke:#ffe14d;fill:#ffe14d;filter:drop-shadow(0 0 5px #ffe14d)}
.hero{background:linear-gradient(130deg,#1d1640,#0f0c22);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--tc) 35%,transparent),inset 0 0 30px #8f7bff1a}
.hero .elo{text-shadow:0 0 12px var(--tc)}
.hero .tier{text-shadow:0 0 10px var(--tc)}
.prow,.card,.stats div,.toggle,.mv{background:#15112d;border:1px solid #2c2558}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 14px #2ef2ff66}
.premium{background:linear-gradient(135deg,#3a1a8a,#c2189a 60%,#ff3dd8);box-shadow:0 0 26px #ff3dd866,inset 0 0 0 1px #ffffff40}
.premium .cta{box-shadow:0 0 14px #fff8}
.demo{border-color:#8f7bff66;color:#c9c2f0}
#tabs{background:#0a0817ee;border-top:1px solid #2ef2ff33;box-shadow:0 -6px 24px #2ef2ff14;backdrop-filter:blur(8px)}
#tabs button[aria-current="page"]{color:#fff;text-shadow:0 0 8px #2ef2ff}
#tabs button[aria-current="page"] .ic{stroke:var(--accent);filter:drop-shadow(0 0 5px #2ef2ff)}
.primary{background:linear-gradient(90deg,#2ef2ff,#8f7bff);color:#0a0718;box-shadow:0 0 16px #2ef2ff77}
.secondary{border-color:#8f7bff88;color:#fff;box-shadow:inset 0 0 12px #8f7bff22}
.danger{border-color:var(--alert);color:var(--alert);box-shadow:0 0 12px #ff4f6d44}
.sheet{background:linear-gradient(180deg,#16112e,#0c0a1c);border-top:1px solid #2ef2ff55;box-shadow:0 -10px 40px #2ef2ff22}
.pcard{background:linear-gradient(180deg,#16112e,#0c0a1c);box-shadow:0 0 0 2px var(--pc),0 0 40px var(--pc),0 20px 60px #000c}
.pcard h2{font-family:var(--fun);font-weight:400;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 #0a0718,0 0 2px #0a0718,0 0 14px color-mix(in srgb,var(--pc) 55%,transparent)}
.pcard .score{font-family:var(--fun);font-weight:400;font-size:2.2rem;color:#fff}
.toast{background:#120f26;color:#fff;border:1px solid var(--accent);box-shadow:0 0 18px #2ef2ff77}
.bubble{background:#fff;color:#0a0718;box-shadow:0 0 18px #ffffff66}
.band{background:linear-gradient(90deg,transparent,#0a0718f2 18%,#0a0718f2 82%,transparent);box-shadow:0 1px 0 #2ef2ff,0 -1px 0 #ff3dd8,0 0 40px #8f7bff55}
.band .k{color:var(--accent);text-shadow:0 0 8px #2ef2ff}
.band .t{color:#fff;text-shadow:0 0 10px #ff3dd8,0 0 30px #ff3dd8aa}
.code{color:var(--accent);text-shadow:0 0 12px #2ef2ff}
.iconbtn{background:#15112d;border:1px solid #2c2558}

/* Partie */
.scorebar{background:linear-gradient(90deg,#1a1236,#0f0c22,#1a1236);border:1px solid #8f7bff55;box-shadow:0 0 16px #8f7bff33}
.scorebar .mid b{color:#fff;text-shadow:0 0 10px #fff9,0 0 22px #8f7bff}
.scorebar .pts{color:var(--neon3);text-shadow:0 0 8px #b6ff3b88}
.scorebar .sd i{box-shadow:0 0 8px var(--pc)}
.strip .av svg{filter:drop-shadow(0 0 6px var(--pc))}
.clock{background:#0c0a1c;border:1px solid #2c2558;color:var(--muted)}
.clock.on{background:#0c0a1c;color:#fff;border-color:var(--pc);box-shadow:0 0 14px var(--pc),inset 0 0 12px color-mix(in srgb,var(--pc) 30%,transparent);text-shadow:0 0 10px var(--pc)}
.clock.low{color:var(--alert)}
.clock.on.low{background:#2a0712;color:#fff;border-color:var(--alert);box-shadow:0 0 18px var(--alert)}
.strip .jp.on{box-shadow:0 0 8px var(--pc)}
.board{background:linear-gradient(180deg,#120e28,var(--bframe));box-shadow:inset 0 0 0 1px #ffffff14,0 0 0 1px #8f7bff55,0 0 30px #8f7bff40,0 0 70px #2ef2ff1c,0 18px 40px #000b}
.cell.v1,.cell.v2{background:color-mix(in srgb,var(--tc) 14%,#0b0918);color:var(--tc);text-shadow:0 0 8px var(--tc);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tc) 85%,transparent),inset 0 0 16px color-mix(in srgb,var(--tc) 35%,transparent),0 0 10px color-mix(in srgb,var(--tc) 45%,transparent)}
.cell.v1{--tc:var(--t1)} .cell.v2{--tc:var(--t2)}
.cell.v2{background:color-mix(in srgb,var(--tc) 24%,#0b0918)}
.num{opacity:1}
.cell.hole{background:#030208;box-shadow:inset 0 0 0 1px #ffffff0d,inset 0 6px 14px #000}
.cell.target{outline-color:var(--pc);box-shadow:inset 0 0 0 2px var(--pc),0 0 16px var(--pc)}
.cell.target::before{opacity:.9;box-shadow:0 0 10px var(--pc)}
.cell.jtarget{box-shadow:0 0 14px var(--pc)}
.cell.hint{box-shadow:0 0 18px var(--ok)}
.pawn .body svg{filter:drop-shadow(0 0 5px var(--pc)) drop-shadow(0 0 14px color-mix(in srgb,var(--pc) 60%,transparent)) drop-shadow(0 4px 3px #000a)}
.pawn.mine .body::before{box-shadow:0 0 10px var(--pc)}
.pawn.picked .body::before{box-shadow:0 0 16px var(--pc),inset 0 0 10px var(--pc)}
.fx.fall{background:var(--t1);box-shadow:0 0 18px var(--t1)}
.fx.ring{box-shadow:0 0 0 3px var(--pc),0 0 20px var(--pc)}
.actions{border-top:1px solid #2ef2ff33}
.act{color:#b9b2e6}
.act .ic{filter:drop-shadow(0 0 4px currentColor)}
.act:not(:disabled):hover,.act:not(:disabled):active{color:#fff}
.act .badge{background:var(--neon2);color:#fff;box-shadow:0 0 8px var(--neon2)}

.jbig{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-family:var(--mono);font-weight:600;font-size:.8rem;white-space:nowrap}

.strip .jp{font-size:.66rem;opacity:.7}
.sheet h2{padding-right:46px}
.xclose{position:sticky;top:0;align-self:flex-end;margin:-4px -4px -50px 0;z-index:3;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--frame);color:var(--ink);font-size:1.15rem;line-height:1;cursor:pointer;display:grid;place-items:center}

.sheet{transition:transform .15s}
.topr{display:flex;align-items:center;gap:8px}
.coins{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 11px;border-radius:999px;border:1px solid #ffd75e88;background:none;color:#ffd75e;font-family:var(--mono);font-weight:600;font-size:.88rem;cursor:pointer}
.coins .ic{width:18px;height:18px;stroke:#ffd75e}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.tswitch{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 2px;border:0;background:none;color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer}
.tswitch .tr{position:relative;width:46px;height:26px;border-radius:999px;background:linear-gradient(90deg,#2ef2ff,#ff3dd8);box-shadow:0 0 10px #2ef2ff66;flex:none}
.tswitch .tr::after{content:"";position:absolute;top:4px;left:24px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tswitch[aria-checked="true"] .tr{background:#4a505c;box-shadow:none}
.tswitch[aria-checked="true"] .tr::after{left:4px}
@property --pp{syntax:'<percentage>';inherits:false;initial-value:0%}
.avatar.adm{position:relative;border-radius:50%;-webkit-touch-callout:none;touch-action:none}
.avatar.adm.pressing::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--accent) var(--pp),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:charge 5s linear forwards}
@keyframes charge{to{--pp:100%}}
.pill.premok{color:#0a0718;background:linear-gradient(90deg,#ffe14d,#ffb02e);border:0}
.friends{display:flex;flex-direction:column;gap:8px;max-height:min(320px,46vh);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.fcard{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#15112d;border:1px solid #2c2558;text-align:left;cursor:pointer;width:100%;color:var(--ink);flex:none}
.fcard .av{width:48px}
.fcard b{display:block;line-height:1.2}
.fcard small{color:var(--muted);font-size:.8rem}
.fcard>small{font-family:var(--mono)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5c5a70;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.fbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fbtns button{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:64px;padding:10px 4px;border-radius:12px;border:1px solid #2ef2ff40;background:#15112d;color:#fff;font-size:.8rem;font-weight:600;cursor:pointer}
.fbtns .ic{stroke:var(--accent)}
.cad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cad>div{padding:10px 8px;border-radius:12px;background:#15112d;border:1px solid #2c2558;display:flex;flex-direction:column;gap:1px;min-width:0}
.cad>div.cur{border-color:var(--accent);box-shadow:0 0 12px #2ef2ff44}
.cad h4{margin:0 0 4px;font-size:.85rem}
.cad b{font-family:var(--mono);font-size:1.12rem;font-variant-numeric:tabular-nums}
.cad small{color:var(--muted);font-size:.7rem;line-height:1.25}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:40px;padding:8px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.linkbtn{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;cursor:pointer;min-height:36px}
.wallet{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:#15112d;border:1px solid #ffd75e66}
.wallet>.ic{width:40px;height:40px;stroke:#ffd75e;filter:drop-shadow(0 0 6px #ffd75e)}
.wallet b{display:block;font-size:1.2rem}
.wallet small{color:var(--muted);font-size:.8rem}
.premium p{margin:0;font-size:.85rem;opacity:.9}
details.sec{border-radius:14px;background:#120f27;border:1px solid #2c2558}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;padding:14px;font-weight:800;font-size:1.02rem;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";color:var(--accent);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec>.in{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px}
.phead{display:flex;align-items:center;gap:14px}
.toggle>span{display:flex;flex-direction:column;gap:2px}
.toggle.off{opacity:.7}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:#15112d;border:1px solid #2c2558;text-align:center}
.bdg .md{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:radial-gradient(circle at 35% 30%,#ffffff66,transparent 60%),var(--bc);box-shadow:0 0 14px var(--bc)}
.bdg.lk .md{background:#241d4a;box-shadow:none;filter:grayscale(1);opacity:.45}
.bdg b{font-size:.8rem;line-height:1.15}
.bdg small{font-size:.66rem;color:var(--muted);line-height:1.2}
.ppath{display:flex;flex-direction:column-reverse;align-items:center;gap:16px;padding:6px 0 30px}
.ustep{align-self:stretch;text-align:center;font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin:6px 0}
.unit{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#3a1a8a,#1b1638);border:1px solid #8f7bff66;margin-top:6px}
.unit b{display:block}
.unit small{color:#c9c2f0;font-size:.8rem}
.node{position:relative;width:70px;height:70px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.25rem;cursor:pointer;transform:translateX(var(--x,0));background:#241d4a;color:#a39cd0;box-shadow:inset 0 -6px 0 #0006}
.node.done{background:linear-gradient(180deg,#ffe14d,#ffb02e);color:#3a2400;box-shadow:inset 0 -6px 0 #0003,0 0 16px #ffe14d88}
.node.cur{background:linear-gradient(180deg,#2ef2ff,#8f7bff);color:#0a0718;box-shadow:inset 0 -6px 0 #0003,0 0 0 7px #2ef2ff33,0 0 26px #2ef2ff;animation:bob 1.6s ease-in-out infinite}
.node:disabled{cursor:default}
.node .ic{width:22px;height:22px}
@keyframes bob{50%{translate:0 -5px}}
.node .me{position:absolute;left:calc(100% + 8px);top:50%;width:40px;height:40px;transform:translateY(-50%)}
.node .frs{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);display:flex}
.node .frs span{width:32px;height:32px;margin-left:-10px;border-radius:50%;background:#0c0a1c;border:2px solid #8f7bff;padding:2px;box-sizing:border-box}
.node svg{width:100%;height:100%;overflow:visible}
.node .stz{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-size:.78rem;letter-spacing:1px;color:#ffe14d;white-space:nowrap;text-shadow:0 0 6px #ffe14d88;font-family:var(--sans,inherit)}
.ppath.pc{gap:26px}
.pzsw{margin:2px 0 8px}
.lvtag{margin:0;font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#a39cd0}
.bigstars{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:92px}
.bigstars span{font-size:64px;line-height:1;color:#2a2350;text-shadow:0 4px 0 #0008}
.bigstars span:nth-child(2){font-size:84px}
.bigstars span.on{color:#ffd75e;text-shadow:0 4px 0 #b07a00,0 0 24px #ffd75ecc;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both;animation-delay:calc(.38s + var(--k)*.33s)}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.bigfail{font-size:64px;line-height:1;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.wtitle{margin:0;font-size:2.3rem;line-height:1;color:#fff;text-shadow:0 3px 0 #0a0718,0 0 2px #0a0718,0 0 14px color-mix(in srgb,var(--pc) 55%,transparent)}
.gain{display:flex;align-items:center;gap:6px;font-size:1.6rem;font-weight:800;color:#ffd75e;animation:pop .5s .9s cubic-bezier(.2,1.6,.4,1) both}
.gain .ic{width:30px;height:30px}
.pcard .row{display:flex;gap:10px;width:100%}
.pcard .row>*{flex:1}
.big2{font-size:1.2rem;padding:16px}
.rwin{width:84px;height:84px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rwin svg{width:100%;height:100%}
.rscore{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.rscore>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;background:#0006;border:2px solid var(--pc)}
.rscore i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.rscore b{font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rscore span{font-family:var(--fun);font-size:2.4rem;line-height:1;color:#fff}
.rscore em{font-style:normal;font-size:1.6rem;opacity:.6}
.stbig{font-size:1.5rem;letter-spacing:3px;color:#ffe14d;text-shadow:0 0 10px #ffe14d99}
.prog{height:12px;border-radius:999px;background:#241d4a;overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b6ff3b,#2ef2ff);box-shadow:0 0 10px #2ef2ff}
.pzhead{display:flex;flex-direction:column;gap:6px}
.radar{position:relative;width:130px;height:130px;margin:4px auto;display:grid;place-items:center}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:radar 1.8s ease-out infinite}
.radar::after{animation-delay:.9s}
.radar .av{width:64px}
@keyframes radar{from{transform:scale(.45);opacity:1}to{transform:scale(1.15);opacity:0}}
.poster{width:100%;max-width:320px;align-self:center;border-radius:12px;box-shadow:0 0 20px #2ef2ff55}
.act.quit{color:var(--alert)}
.demo-cap{font-family:var(--mono);font-size:.75rem;color:var(--accent);margin-right:6px}
.fist{position:absolute;width:min(48vmin,270px);pointer-events:none;animation:punch .28s cubic-bezier(.3,0,.4,1) forwards}
.fist svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 0 10px var(--pc)) drop-shadow(0 12px 18px #000c)}
@keyframes punch{0%{transform:translate(-50%,-25%) scale(1.6) rotate(var(--rot));opacity:0}45%{transform:translate(-50%,-50%) scale(.96) rotate(var(--rot));opacity:1}60%{transform:translate(-50%,-50%) scale(.9) rotate(var(--rot));opacity:1}100%{transform:translate(-50%,-36%) scale(1.3) rotate(var(--rot));opacity:0}}
.impact{position:absolute;width:140px;height:140px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--pc),0 0 34px var(--pc),inset 0 0 24px var(--pc);animation:imp .45s ease-out forwards}
@keyframes imp{from{opacity:.95;scale:.3}to{opacity:0;scale:1.9}}
.tocw{position:absolute;font-weight:800;font-size:1.6rem;color:#fff;text-shadow:0 0 10px var(--pc),0 3px 0 #000;transform:translate(-50%,-50%);animation:knock .6s ease-out forwards;--rot:0deg;pointer-events:none}
.fcard:focus-visible,.node:focus-visible,.tswitch:focus-visible,.coins:focus-visible,.xclose:focus-visible,.fbtns button:focus-visible,.seg button:focus-visible,.linkbtn:focus-visible,details.sec>summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.jbig.on,.node.cur,.radar::before,.radar::after,.fist,.impact,.avatar.adm.pressing::after{animation:none!important}}

/* ===== Thème calme (moins lumineux) ===== */
html.calm{--felt:#16181d;--frame:#1d2027;--raise:#252930;--raise2:#2c313a;--line:#3a404b;--ink:#e8e6e1;--muted:#a7abb2;--accent:#86bccc;--neon2:#d29abb;--neon3:#a9c98a;--go:#a9c98a;--alert:#e48a7f;--ok:#8fc9a2;--prem:#a99be0}
html.calm body{background:#16181d}
html.calm *{text-shadow:none!important}
html.calm .ic,html.calm svg{filter:none!important}
html.calm .logo{color:var(--ink)}
html.calm .logo span{color:var(--accent);animation:none}
html.calm .big,html.calm .act.primary,html.calm .primary{background:#86bccc;color:#0f1a1e;box-shadow:none}
html.calm .big small{color:#0f1a1e}
html.calm .item,html.calm .timebtn,html.calm .prow,html.calm .card,html.calm .stats div,html.calm .toggle,html.calm .mv,html.calm .fcard,html.calm .cad>div,html.calm .bdg,html.calm details.sec,html.calm .lesson,html.calm .pzgrid button,html.calm .fbtns button,html.calm .iconbtn,html.calm .wallet,html.calm .seg button{background:var(--raise);border-color:var(--line);box-shadow:none;color:var(--ink)}
html.calm .item .lock,html.calm .pill.prem{box-shadow:none}
html.calm .unit{background:#2a2f3a;border-color:var(--line)}
html.calm .unit small{color:var(--muted)}
html.calm .hero{background:var(--raise);box-shadow:none;border-color:var(--line)}
html.calm .premium{background:linear-gradient(135deg,#3d4a66,#5a4a6e);box-shadow:none}
html.calm #tabs{background:#121418;border-top-color:var(--line);box-shadow:none;backdrop-filter:none}
html.calm .sheet{background:var(--frame);border-top-color:var(--line);box-shadow:0 -10px 30px #0008}
html.calm .pcard{background:var(--frame);box-shadow:0 0 0 2px var(--pc),0 20px 60px #000c}
html.calm .secondary{border-color:var(--line);box-shadow:none}
html.calm .danger{box-shadow:none}
html.calm .toast{background:var(--ink);color:#16181d;border:0;box-shadow:0 8px 30px #000a}
html.calm .scorebar{background:var(--raise);border-color:var(--line);box-shadow:none}
html.calm .scorebar .pts{color:var(--neon3)}
html.calm .board{background:var(--bframe);box-shadow:inset 0 0 0 1px #ffffff10,0 12px 30px #0007}
html.calm .cell.v1,html.calm .cell.v2{box-shadow:inset 0 -4px 0 #0003,inset 0 1px 0 #fff4}
html.calm .cell.v1{background:var(--t1);color:var(--x1)}
html.calm .cell.v2{background:var(--t2);color:var(--x2)}
html.calm .cell.hole{background:#0d0f12;box-shadow:inset 0 4px 10px #000c}
html.calm .cell.target,html.calm .cell.jtarget{box-shadow:inset 0 0 0 2px var(--pc)}
html.calm .cell.hint{box-shadow:none}
html.calm .pawn .body svg,html.calm .strip .av svg{filter:drop-shadow(0 4px 3px #0009)!important}
html.calm .pawn.mine .body::before,html.calm .pawn.picked .body::before{box-shadow:none}
html.calm .clock{background:#121418;border-color:var(--line)}
html.calm .clock.on{background:#e8e6e1;color:#16181d;box-shadow:none;border-color:transparent}
html.calm .clock.on.low{background:var(--alert);color:#2a0f08}
html.calm .coord{color:var(--muted)}
html.calm .mini .v1{background:var(--t1);color:var(--x1);box-shadow:none}
html.calm .mini .v2{background:var(--t2);color:var(--x2);box-shadow:none}
html.calm .node{background:#2c313a;color:var(--muted)}
html.calm .node.cur{background:#86bccc;color:#0f1a1e;box-shadow:inset 0 -6px 0 #0003;animation:none}
html.calm .node.done{background:#d8c27a;color:#2a2210;box-shadow:inset 0 -6px 0 #0003}
html.calm .prog{background:#2c313a}
html.calm .prog i{background:var(--ok);box-shadow:none}
html.calm .jbig.on{box-shadow:none;animation:none}
html.calm .tr-explain{background:var(--raise);border-color:var(--line);color:var(--ink)}
html.calm .band{background:linear-gradient(90deg,transparent,#16181df2 18%,#16181df2 82%,transparent);box-shadow:none}
html.calm .coins{border-color:#d8c27a88;color:#d8c27a}
html.calm .coins .ic,html.calm .wallet>.ic{stroke:#d8c27a}
html.calm .ratings th,html.calm .ratings td{border-bottom-color:var(--line)}
html.calm .ratings .cur td{background:#86bccc14}
html.calm .bubble{box-shadow:none}
html.calm .cad>div.cur{box-shadow:none}
html.calm .bdg .md{box-shadow:none}
html.calm .act{color:var(--muted)}
html.calm .actions{border-top-color:var(--line)}
html.calm .lesson .no{box-shadow:none}
html.calm .code{color:var(--accent)}

/* ===== v7 ===== */

/* Langue : choix du joueur, sinon langue du téléphone (français si le téléphone est en français, anglais sinon) */
const LANG=(()=>{ try { const p=JSON.parse(localStorage.getItem('dernier-pas-profil')); if (p && (p.lang==='fr'||p.lang==='en')) return p.lang; } catch(e){} return /^fr/i.test(navigator.language||'') ? 'fr' : 'en'; })();
// T("texte français") → texte dans la langue du joueur. Tout nouveau texte visible doit passer par T().
const PTS_RULE="Gagner une manche rapporte 10 points, plus la somme des chiffres encore visibles sur le plateau (les cases sous les pions ne comptent pas). Si cette somme est inférieure à 10, le perdant marque la différence, 5 points au maximum (il reste 5 : 15 à 5 ; il reste 2 : 12 à 5).";
const EN_YOU={'commence':'start','remporte la partie':'win the game','gagne la manche.':'win the round.','gagne':'win','gagne la manche':'win the round','commence la manche':'start round','gagne !':'win!'};
const T3 = (name, fr) => (LANG==='en' && name===T('Toi') && EN_YOU[fr]) || T(fr);
const T = s => (LANG==='en' && window.EN_DICT && EN_DICT[s]) || s;
document.documentElement.lang=LANG;
if (LANG==='en') document.querySelectorAll('[aria-label]').forEach(el=>{ const v=el.getAttribute('aria-label'); if (EN_DICT[v]) el.setAttribute('aria-label',EN_DICT[v]); });
/* ---------- Réglages de lancement ---------- */
const CONFIG = {
  season0: false,         // Saison 0 terminée : la personnalisation s'achète avec des pièces gagnées en jouant
  supportUrl: '',         // lien de soutien (Stripe Payment Link, Ko-fi…). Vide = bouton masqué
  contact: (T("contact@exemple.fr")),
  version: 64,           // numéro affiché dans les réglages (à augmenter à chaque mise à jour)
  themeChoice: false,     // choix Néon / Calme masqué pour l'instant (mettre true pour le réafficher)   // À REMPLACER par l'e-mail de contact que tu veux rendre public
};
const N=5, DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
const START=[[20,24],[4,0]];
const BOARDS=[
 [(T("Damier")),'21212 12121 21212 12121 21212'],
 [(T("Forteresse")),'22222 21112 21212 21112 22222'],
 [(T("Rivière")),'21212 22222 11211 22222 21212'],
 [(T("Croix")),'21212 11211 22222 11211 21212'],
 [(T("Diagonales")),'21112 12121 11211 12121 21112'],
 [(T("Couronne")),'21112 12221 12121 12221 21112'],
 [(T("Sablier")),'22222 12221 11211 12221 22222'],
 [(T("Îlots")),'22112 22112 11211 21122 21122'],
 [(T("Moulin")),'22112 12122 12221 22121 21122'],
 [(T("Colonnes")),'21212 21212 21212 21212 21212'],
].map(([name,rows])=>({name, cells:[...rows.replace(/ /g,'')].map(Number)}));
const LEVELS={
  easy:{label:(T("Débutant")),elo:600,random:.5,maxDepth:1,budget:100},
  lumi:{label:(T("Facile")),elo:800,random:.3,maxDepth:1,budget:150},
  braise:{label:(T("Facile +")),elo:1000,random:.15,maxDepth:2,budget:250},
  medium:{label:(T("Moyen")),elo:1200,random:.05,maxDepth:3,budget:400},
  prof:{label:(T("Moyen +")),elo:1400,random:0,maxDepth:5,budget:700},
  hard:{label:(T("Difficile")),elo:1600,random:0,maxDepth:30,budget:1200},
  expert:{label:(T("Expert")),elo:1800,random:0,maxDepth:40,budget:3000},
};
const AI_TIMEOUT={};
function aiGen(cells,P,J,t){
  const a=P[0][0],b=P[0][1],c=P[1][0],d=P[1][1],out=[];
  for(let k=0;k<2;k++){
    const pos=P[t][k],r0=(pos/5)|0,q0=pos%5;
    for(let dd=0;dd<4;dd++){
      const dr=DIRS[dd][0],dq=DIRS[dd][1]; let crossed=false;
      for(let s=1;s<=3;s++){
        const r=r0+dr*s,q=q0+dq*s; if(r<0||q<0||r>4||q>4) break;
        const i=r*5+q;
        if(i===a||i===b||i===c||i===d||cells[i]===0){ if(!J[t]) break; crossed=true; continue; }
        out.push([k,i,crossed?1:0]);
      }
    }
  }
  return out;
}
function aiMob(cells,P,t){
  const a=P[0][0],b=P[0][1],c=P[1][0],d=P[1][1]; let n=0;
  for(let k=0;k<2;k++){
    const pos=P[t][k],r0=(pos/5)|0,q0=pos%5;
    for(let dd=0;dd<4;dd++){
      for(let s=1;s<=3;s++){
        const r=r0+DIRS[dd][0]*s,q=q0+DIRS[dd][1]*s; if(r<0||q<0||r>4||q>4) break;
        const i=r*5+q; if(i===a||i===b||i===c||i===d||cells[i]===0) break; n++;
      }
    }
  }
  return n;
}
function aiEval(cells,P,J,t){ return 2*(aiMob(cells,P,t)-aiMob(cells,P,1-t)) + 3*(J[t]-J[1-t]); }
function aiSearch(cells,P,J,t,depth,alpha,beta,deadline){
  if(deadline && performance.now()>deadline) throw AI_TIMEOUT;
  const ms=aiGen(cells,P,J,t);
  if(!ms.length) return -1000-depth;
  if(depth===0) return aiEval(cells,P,J,t);
  let best=-Infinity;
  for(const m of ms){
    const k=m[0],from=P[t][k];
    cells[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
    const v=-aiSearch(cells,P,J,1-t,depth-1,-beta,-alpha,deadline);
    cells[from]++; P[t][k]=from; if(m[2]) J[t]=1;
    if(v>best) best=v; if(v>alpha) alpha=v; if(alpha>=beta) break;
  }
  return best;
}
function aiChoose(st,level){
  const L=LEVELS[level], t=st.turn;
  const snap=()=>[st.cells.slice(), st.pawns.map(p=>p.slice()), st.jumps.slice()];
  let [c,P,J]=snap();
  const ms=aiGen(c,P,J,t);
  if(!ms.length) return null;
  for(let i=ms.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=ms[i]; ms[i]=ms[j]; ms[j]=x; }
  if(Math.random()<L.random) return ms[0];
  const deadline=performance.now()+L.budget; let best=ms[0];
  for(let d=1; d<=L.maxDepth; d++){
    [c,P,J]=snap();
    try{
      let bv=-Infinity,bm=best,alpha=-Infinity;
      for(const m of [best,...ms.filter(x=>x!==best)]){
        const k=m[0],from=P[t][k];
        c[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
        const v=-aiSearch(c,P,J,1-t,d-1,-Infinity,-alpha,deadline);
        c[from]++; P[t][k]=from; if(m[2]) J[t]=1;
        if(v>bv){ bv=v; bm=m; } if(v>alpha) alpha=v;
      }
      best=bm; if(bv>=1000||bv<=-1000) break;
    }catch(e){ if(e!==AI_TIMEOUT) throw e; break; }
  }
  return best;
}
function aiAnalyze(st){
  const t=st.turn,c=st.cells.slice(),P=st.pawns.map(p=>p.slice()),J=st.jumps.slice();
  const ms=aiGen(c,P,J,t); let best=-Infinity,bm=null,played=null;
  for(const m of ms){
    const k=m[0],from=P[t][k];
    c[from]--; P[t][k]=m[1]; if(m[2]) J[t]=0;
    const v=-aiSearch(c,P,J,1-t,3,-Infinity,Infinity,0);
    c[from]++; P[t][k]=from; if(m[2]) J[t]=1;
    if(v>best){ best=v; bm=m; }
    if(m[0]===st.move[0]&&m[1]===st.move[1]&&m[2]===st.move[2]) played=v;
  }
  return {best,bm,played};
}

/* Musique du jeu : le thème officiel de Lastep (music.mp3), en boucle pendant les parties */
const MUSIC={el:null, gain:null, on:false};
// La musique démarre au début de chaque nouvelle partie et continue entre les manches.
// En ligne, elle est calée sur l'heure de début de la partie (M.mt), partagée par les deux joueurs : même morceau, même moment.
function acMusic(){ try { if (!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); } catch(e){ AC=null; } return AC; }
function musicEl(){
  if (MUSIC.el) return MUSIC.el;
  const c=acMusic(); if (!c) return null;
  const el=new Audio('music.mp3'); el.loop=true; el.preload='auto'; el.setAttribute('playsinline','');
  MUSIC.el=el; MUSIC.gain=c.createGain(); MUSIC.gain.gain.value=0;
  try { c.createMediaElementSource(el).connect(MUSIC.gain).connect(c.destination); } catch(e){}
  return el;
}
function musicSync(){
  const el=MUSIC.el; if (!el || !M) return;
  const mt=M.mt || 0, dur=el.duration;
  if (!mt){ if (MUSIC.mid!==M.id){ try { el.currentTime=0; } catch(e){} } MUSIC.mid=M.id; return; }
  if (!dur || !isFinite(dur)){ el.addEventListener('loadedmetadata', musicSync, {once:true}); return; }
  const want=Math.max(0, (Date.now()-mt)/1000) % dur;
  if (MUSIC.mt!==mt || Math.abs(el.currentTime-want)>0.6){ try { el.currentTime=want; } catch(e){} }
  MUSIC.mt=mt; MUSIC.mid=M.id;
}
function musicStart(){
  if (!P.music) return;
  const el=musicEl(); if (!el) return;
  musicSync();
  if (MUSIC.on && !el.paused) return;
  const c=AC, g=MUSIC.gain.gain; g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(.4,c.currentTime+1.5);
  MUSIC.on=true; el.play().then(musicSync).catch(()=>{ MUSIC.on=false; MUSIC.wait=true; });
}
// Les navigateurs bloquent le son tant que le joueur n'a pas touché l'écran : on « déverrouille » la musique au premier contact,
// et si elle n'a pas pu démarrer (partie rejointe en ligne), elle démarre dès le prochain toucher.
document.addEventListener('pointerdown', ()=>{
  const c=acMusic(); if (!c) return;
  if (!MUSIC.el){ const el=musicEl(); if (el){ el.muted=true; el.play().then(()=>{ if (!MUSIC.on) el.pause(); el.muted=false; }).catch(()=>{ el.muted=false; }); } }
  if (MUSIC.wait && view==='game' && M && G && P.music){ MUSIC.wait=false; musicStart(); }
}, true);
function musicStop(){
  if (!MUSIC.on) return; MUSIC.on=false;
  const c=AC, g=MUSIC.gain&&MUSIC.gain.gain;
  if (c && g){ try { g.cancelScheduledValues(c.currentTime); g.setValueAtTime(g.value,c.currentTime); g.linearRampToValueAtTime(0,c.currentTime+.6); } catch(e){} }

}
document.addEventListener('visibilitychange', ()=>{ if (!MUSIC.el) return; if (document.hidden) MUSIC.el.pause(); else if (MUSIC.on){ musicSync(); MUSIC.el.play().catch(()=>{ MUSIC.wait=true; }); } });

let worker=null, reqId=0; const pending=new Map();
const runInline = (type,p) => type==='choose' ? aiChoose(p.st,p.level) : p.list.map(aiAnalyze);
function initWorker(){
  try {
    const src=`${T("const N=5,DIRS=")}${JSON.stringify(DIRS)},AI_TIMEOUT={},LEVELS=${JSON.stringify(LEVELS)};
${aiGen}\n${aiMob}\n${aiEval}\n${aiSearch}\n${aiChoose}\n${aiAnalyze}
onmessage=e=>{const d=e.data;let r=null;try{r=d.type==='choose'?aiChoose(d.p.st,d.p.level):d.p.list.map(aiAnalyze);}catch(err){}postMessage({id:d.id,r});};`;
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=e=>{ const q=pending.get(e.data.id); if (q){ pending.delete(e.data.id); q.res(e.data.r); } };
    worker.onerror=()=>{ worker=null; for (const [id,q] of pending){ pending.delete(id); setTimeout(()=>{ try{ q.res(runInline(q.type,q.p)); }catch(err){ q.res(null); } },20); } };
  } catch(e){ worker=null; }
}
function ask(type,p){ return new Promise(res=>{ if (worker){ const id=++reqId; pending.set(id,{res,type,p}); worker.postMessage({id,type,p}); return; } setTimeout(()=>{ try{ res(runInline(type,p)); }catch(e){ res(null); } },30); }); }

  const cnt=[{blunder:0,mistake:0},{blunder:0,mistake:0}];
  const rows=h.map((e,j)=>{ const a=AN.res[j], jd=judge(a); if (cnt[e.turn][jd.k]!==undefined) cnt[e.turn][jd.k]++;
    return `<button type="button" class="mv" data-act="an-sel" data-v="${j}" aria-current="${AN.sel===j}"><span class="n">${j+1}.</span><span>${who(e.turn)} <code>${sq(e.pawns[e.turn][e.move[0]])}${e.move[2]?'↷':'→'}${sq(e.move[1])}</code></span><span class="badge2 ${jd.k}">${jd.t}</span></button>`; }).join('');
  const e=h[AN.sel], a=AN.res[AN.sel], from=e.pawns[e.turn][e.move[0]];
  const mini=e.cells.map((v,i)=>{ const pw=[0,1].find(p=>e.pawns[p].includes(i)); let c=v===0?'h':'v'+v; if (pw!==undefined) c+=' pw'; if (i===from) c+=' fr'; if (a&&a.bm&&i===a.bm[1]) c+=' bs'; else if (i===e.move[1]) c+=' pl'; return (i%5===0?`<div class="lb">${5-((i/5)|0)}</div>`:'')+`<div class="${c}" ${pw!==undefined?`${T("style=\"--pc:")}${S[pw].hex}"`:''}>${v||''}</div>`; }).join('')+'<div class="lb"></div>'+[...COLS].map(l=>`<div class="lb">${l}</div>`).join('');
  const same=a&&a.bm&&a.bm[0]===e.move[0]&&a.bm[1]===e.move[1]&&a.bm[2]===e.move[2];
  const best=a&&a.bm&&!same ? ` ${T("Meilleur :")} <code class="sqb">${sq(e.pawns[e.turn][a.bm[0]])}${a.bm[2]?'↷':'→'}${sq(a.bm[1])}</code> ${T("(case verte).")}` : same ? (" "+T("C'était le meilleur coup.")) : '';
  return `${head}<p>${[0,1].map(p=>`${who(p)} : ${cnt[p].blunder} ${T(cnt[p].blunder>1?'graves':'grave')}, ${cnt[p].mistake} ${T(cnt[p].mistake>1?'imprécisions':'imprécision')}`).join('<br>')}</p>
    <div class="mini">${mini}</div>
    <p>${T("Coup")} ${AN.sel+1} : ${who(e.turn)} ${T("joue")} <code class="sqp">${sq(from)}${e.move[2]?'↷':'→'}${sq(e.move[1])}</code>${same?'':(" "+T("(case rouge)"))}.${best} <span class="badge2 ${judge(a).k}">${judge(a).t}</span></p>
    <div class="row"><button class="secondary" type="button" data-act="an-prev" ${AN.sel?'':'disabled'}>${T("◀ Précédent")}</button><button class="secondary" type="button" data-act="an-next" ${AN.sel<h.length-1?'':'disabled'}>${T("Suivant ▶")}</button></div>
    <div class="moves">${rows}</div>
    <p class="note">${T("Les lettres a à e et les chiffres 1 à 5 donnent la case, comme aux échecs. Cadre pointillé : case de départ. Rouge : coup joué. Vert : meilleur coup. « Victoire manquée » et « Coup perdant » sont certains, le reste est estimé.")}</p>`;
}

/* ---------- Rendu général ---------- */
function render(){
  S=sides(); applyTheme();
  const inGame = view==='game' && M && G;
  $('#app').classList.toggle('ingame', !!inGame);
  document.documentElement.classList.toggle('lock', !!inGame);
  document.documentElement.classList.toggle('homefix', !inGame && view==='home');
  $('#game').hidden=!inGame; $('#screen').hidden=!!inGame; $('#tabs').hidden=!!inGame;
  if (inGame) renderGame();
  else {
    if (view==='game') view='play';
    const html = view==='home'?renderHome():view==='shop'?renderShop():view==='profile'?renderProfile():view==='puzzles'?renderPuzzles():view==='parc'?renderParc():view==='learn'?renderLearn():renderPlay();
    if ($('#screen').dataset.v!==view || $('#screen').innerHTML!==html){ $('#screen').innerHTML=html; $('#screen').dataset.v=view; }
    renderTabs();
  }
  renderSheet();
}

/* ---------- Pendule ---------- */
let lastTick=performance.now(), lastSleep=false;
setInterval(()=>{
  const now=performance.now(), dt=now-lastTick; lastTick=now;
  onlineWatch();
  if (RUSH && TR && TR.rush && view==='game'){ rushTick(dt); }
  if (isParc() && view==='game') parcTick(dt);
  if (TR && TR.mode && TR.mode!=='rush' && view==='game'){ const el=document.getElementById('clk0'); if (el) el.textContent=fmt(now-(TR.mode==='dj'&&DJ?DJ.t0:TR.t0)); }
  if (G && !G.over && view==='game' && !document.hidden){ ptAdd(Math.min(dt,1000)); P.playMs=(P.playMs||0)+Math.min(dt,1000); if (P.playMs>=60000){ P.playMs-=60000; addCoins(2,true); } }
  if (!G || G.over || now<introUntil || G.noClock || G.bombPhase) return;
  G.clock[G.turn]=Math.max(0,G.clock[G.turn]-dt);
  if (G.clock[G.turn]<=0 && (!online()||G.turn===net.seat)){ G.msg=`${T("Temps écoulé pour")} ${S[G.turn].name}.`; endRound(1-G.turn); commit(); return; }
  const el=document.getElementById('clk'+G.turn); if (el){ el.textContent=fmt(G.clock[G.turn]); el.classList.toggle('low',G.clock[G.turn]<30000); }
  if (wzLast && now%1000<200) renderActions();
  const sl=asleep(G.turn); if (sl!==lastSleep){ lastSleep=sl; renderGame(); }
},200);


/* ---------- Défi du jour, historique, installation ---------- */
const dayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000) / 864e5);
const dailyBoard = () => dayNum() % BOARDS.length;
const dailyLevel = () => ['medium','hard','medium','expert','hard','medium','hard'][dayNum()%7];
function dailyCard(){
  const d=P.daily||{}, done=d.last===dayKey(), b=BOARDS[dailyBoard()], lv=dailyLevel();
  return `<button class="item" type="button" data-act="daily" style="flex-direction:column;gap:4px;align-items:stretch;text-align:left">
    <span style="display:flex;align-items:center;gap:10px">${ic('trophy')}${T("Défi du jour")} ${d.streak?`<span class="lock" style="color:var(--accent);border-color:var(--accent)">${T("série")} ${d.streak} j</span>`:''}</span>
    <span class="sub" style="font-weight:500">${done?(T("Relevé aujourd'hui. Reviens demain pour prolonger ta série.")):`${T("Bats")} ${BOTS[lv].name} (${LEVELS[lv].label}${T(") sur le plateau")} ${b.name}.`}</span></button>`;
}
function startDaily(){ leaveOnline(); vsAI=dailyLevel(); training=false; dailyNext=true; startMatch(); }
function recordGame(){
  if (!M || !M.done || REC_ID===M.id) return; REC_ID=M.id; if (!M.aborted) markActive();
  const me=humanSeat(); if (me===-1) return;
  const c=mWinner(), w=me===null ? null : me===c;
  P.stat.games=(P.stat.games||0)+1;
  if (new Date().getHours()<5) badge('insomniaque');
  if (P.stat.games>=20) badge('marathon');
  if (w===null){ saveP(); return; }
  const op=S[me===0?1:0], src=online()?(net.mm?'online':'ami'):vsAI?'ia':'local';
  let de=M.eloDelta;
  if (online() && CHAMP_ID!==M.id){ CHAMP_ID=M.id; const o=PEERS[1-me]; LAST_CHAMP=applyChamp(w?1:0, o && o.rc ? (o.rc[P.time]||1000) : 1000); de=LAST_CHAMP; }
  P.games=[...(P.games||[]), {op:op.name, sk:op.skin, w, sc:`${M.wins[me]}-${M.wins[1-me]}`, d:new Date().toLocaleDateString((T("fr-FR")),{day:'numeric',month:'short'}), de, src, t:P.time, uid: online()&&PEERS[1-me]?PEERS[1-me].uid:''}].slice(-50);
  if (M.daily && w){ const d=P.daily||{}, today=dayKey(), y=new Date(); y.setDate(y.getDate()-1); if (d.last!==today){ P.daily={last:today, streak: d.last===dayKey(y) ? (d.streak||0)+1 : 1}; } }
  addCoins(w?10:3, true);
  if (w && src==='ia') xpAdd(5); if (w && src==='online') xpAdd(10);
  if (w && !M.forfeit){ if (M.rounds.length===3) badge('belle'); if (M.wins[1-me]===0) badge('carton'); if (vsAI==='expert' && !M.train) badge('sphinx'); if (TAUNT_ID!==M.id) badge('zen'); }
  if (w && online()) badge('enligne');
  if (P.daily && P.daily.streak>=3) badge('enfeu');
  saveP();
}

function buildLesson(g){
  const ty=g.ty, z=g.demo, x=g.ex, surv=/surv/.test(ty) ? (ty==='jsurv'?2:+ty.slice(-1)) : 0, win=/win/.test(ty) ? +ty.slice(-1) : 0;
  let steps;
  if (['mob','cut','diff'].includes(ty)) steps=[{cap:g.caps[0]},{cap:g.caps[1], mv:[0,...z.sol]},{cap:g.caps[2]}];
  else steps=[{cap:g.caps[0]}, ...z.line.map((mv,i)=>({cap: i===0 ? g.caps[1] : i===z.line.length-1 ? g.caps[2] : mv[0]===1 ? (T("L'adversaire se défend au mieux…")) : (T("On continue…")), line:i}))];
  const ex={z:x, text:EX_TXT[ty]};
  if (ty==='mob') Object.assign(ex,{max:1, opp:'none', ok:()=>aiMob(G.cells,G.pawns,0)>=x.best, why:EX_WHY.mob});
  else if (ty==='cut') Object.assign(ex,{max:1, opp:'none', ok:()=>aiMob(G.cells,G.pawns,1)<=x.best, why:EX_WHY.cut});
  else if (ty==='diff') Object.assign(ex,{max:1, opp:'none', ok:()=>aiMob(G.cells,G.pawns,0)-aiMob(G.cells,G.pawns,1)>=x.best, why:EX_WHY.diff});
  else if (surv) Object.assign(ex,{max:surv+1, opp:'ai', surv, ok:()=>G.over && G.winner===0, why: ty==='jsurv'?EX_WHY.jsurv:EX_WHY.surv});
  else Object.assign(ex,{max:win, opp:'ai', ok:()=>G.over && G.winner===0, why: ty==='jwin1'?EX_WHY.jwin1:EX_WHY.win});
  return {id:g.id, p:1, t:g.t, d:g.d, demo:{z, line:z.line, steps}, ex};
}

const PZ_FREE=10, PZ_DAY=5;
const pzToday = () => { const pd=P.pzDay||{}; return pd.d===dayKey() ? pd.n||0 : 0; };   // gratuit : 10 puzzles ; Premium doit toujours en avoir au moins le double
function hash32(str){ let h=2166136261; for (const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
const rot90 = i => (i%5)*5 + (4-((i/5)|0));   // quart de tour, sens horaire
function rotZ(z, q){
  if (!q) return z; let c=cellsFrom(z.c), p=z.p.map(x=>x.slice()), sol=z.sol.slice();
  for (let k=0;k<q;k++){ const c2=Array(25); c.forEach((v,i)=>c2[rot90(i)]=v); c=c2; p=p.map(x=>x.map(rot90)); sol=[sol[0],rot90(sol[1]),sol[2]]; }
  return {...z, c:c.join(''), p, sol};
}
const pzRot = key => hash32(P.uid+':'+key)%4;
function startPuzzle(cat, idx, mode){
  const z0=PUZ[cat][idx]; if (!z0) return;
  const n=pzIndex(cat,idx); if (!mode && n>=PZ_FREE && !P.premium){ sheet={type:'locked', what:'premiumpz'}; render(); return; }
  if (!mode && !P.premium && !(P.puz||{})[cat+idx] && pzToday()>=PZ_DAY){ sheet={type:'limit', pz:1}; render(); return; }
  const z=rotZ(z0, pzRot(cat+idx));
  TR={kind:'puzzle', cat, idx, z, my:0, state:'play', rush:mode==='rush', mode:mode||'', t0:performance.now()};
  trBase(cellsFrom(z.c), z.p, z.j, z.b);
  startTurn(); G.msg=''; render();
}
function startLesson(i){
  const L=LESSONS[i]; if (!L) return;
  if (L.p && !P.premium){ sheet={type:'limit', prem:1}; render(); return; }
  if (!P.premium && !TUTO && !(P.lessons||{})[L.id]){ const ld=P.lessonDay||{}; if (ld.d===dayKey() && ld.n>=1){ sheet={type:'limit'}; render(); return; } }
  TR={kind:'lesson', i, L, phase:'demo', step:-1, my:0, state:'demo'};
  const d=L.demo;
  if (d.z) trBase(cellsFrom(d.z.c), d.z.p, d.z.j, d.z.b); else trBase(d.c, d.p, [1,1], 0);
  G.turn=0; G.pick=null; render(); playDemo();
}
function demoMove(p,k,to,jump){

  look(p,k,from,to); G.last={p,from,to,jump}; const fell=G.cells[from]===0; fx(from,to,p,fell); sfx.move(); if (fell) setTimeout(sfx.fall,200); if (jump) sfx.jump();

function trRestart(){
  if (!TR) return;
  if (TR.kind==='parc') return startParc(TR.i, '', TR.state==='win' ? 0 : TR.tries+1);
  if (TR.kind==='puzzle') startPuzzle(TR.cat, TR.idx);
  else if (TR.phase==='ex' || TR.state==='win' || TR.state==='fail') { sheet=null; startExercise(); }
  else startLesson(TR.i);
}
function trDone(ok, why){
  const tr=TR; tr.state=ok?'win':'fail'; tr.why=why||''; if (ok) markActive();
  if (tr.rush){ sfx[ok?'move':'round'](); render(); rushAfter(ok); return; }
  if (tr.mode==='dj'){ sfx[ok?'win':'round'](); render(); djAfter(ok); return; }
  if (tr.mode==='chal'){ sfx[ok?'win':'round'](); render(); chalAfter(ok, performance.now()-tr.t0); return; }
  if (ok && tr.kind==='puzzle') tr.ms=performance.now()-tr.t0;
  if (ok){
    if (tr.kind==='puzzle'){ P.puz=P.puz||{}; const key=tr.cat+tr.idx, first=!P.puz[key]; P.puz[key]=1;
      if (first){ P.coins=(P.coins||0)+5; xpAdd(5); toast((T("+5 pièces"))); if (!tr.mode){ const pd=P.pzDay||{}, td=dayKey(); P.pzDay={d:td, n:(pd.d===td?pd.n:0)+1}; } if (!(P.stat.pzTried||{})[key]) P.stat.first=(P.stat.first||0)+1; } saveP(); puzBadges(); }
    else { P.lessons=P.lessons||{}; const first=!P.lessons[tr.L.id]; P.lessons[tr.L.id]=1; if (first){ P.coins=(P.coins||0)+10; if (!TUTO){ const ld=P.lessonDay||{}, td=dayKey(); P.lessonDay={d:td, n:(ld.d===td?ld.n:0)+1}; } } saveP();
      if (tr.L.id==='l1') badge('pas1'); if (LESSONS.filter(L=>!L.p).every(L=>P.lessons[L.id])) badge('eleve'); }
    saveP(); sfx.win(); presBroadcast();
    if (!REDUCED){ const box=$('#fxscreen'); [(T("BRAVO"))].forEach(t=>{ const w=document.createElement('div'); w.className='wword'; w.textContent=t; w.style.setProperty('--pc','#b6ff3b'); w.style.setProperty('--rot','-6deg'); w.style.left='22%'; w.style.top='38%'; box.appendChild(w); setTimeout(()=>w.remove(),800); }); }
  } else { if (tr.kind==='puzzle'){ P.stat.pzTried=P.stat.pzTried||{}; P.stat.pzTried[tr.cat+tr.idx]=1; saveP(); } sfx.round(); }
  render(); setTimeout(()=>{ if (TR===tr){ sheet={type: TUTO&&ok&&tr.kind==='lesson'?'tuto':ok&&tr.kind==='lesson'?'ldone':'tr'}; render(); } }, 700);
}
function trAfterMove(t, m){
  const tr=TR; if (!tr || t!==0 || tr.state!=='play') return;
  tr.my++;
  if (tr.kind==='lesson'){
    const ex=tr.L.ex;
    if (ex.ok()) return trDone(true, ex.why);
    if (tr.my>=ex.max) return trDone(false, (T("Objectif pas atteint dans le nombre de coups. Réessaie !")));
    if (ex.opp==='pass'){ G.turn=0; G.over=false; startTurn(); G.msg=''; render(); return; }
    if (ex.opp==='ai') return trOppReply();
    return;
  }
  const z=tr.z;
  if (tr.cat==='adv'){
    const h=HIST[G.round], e=h[h.length-1]; tr.state='check'; G.over=true; render();
    ask('analyze',{list:[e]}).then(r=>{
      if (TR!==tr) return; const a=r&&r[0];
      const after=[aiMob(G.cells,G.pawns,0), aiMob(G.cells,G.pawns,1)];
      const c2=e.cells.slice(), P2=e.pawns.map(x=>x.slice()), bm=a?a.bm:z.sol; c2[P2[0][bm[0]]]--; P2[0][bm[0]]=bm[1];
      const bestAfter=[aiMob(c2,P2,0), aiMob(c2,P2,1)];
      const ok = a && (a.played>=a.best-2);
      const txt=`${T("Après ton coup, tu as")} ${after[0]} ${T("déplacements possibles et l'adversaire")} ${after[1]}. `+
        (ok ? (T("C'est l'avantage : plus de liberté pour toi, moins pour lui.")) : !P.premium ? (T("Ce n'était pas le meilleur coup. Cherche celui qui te laisse plus de déplacements et lui en laisse moins. (La solution est réservée à Premium.)")) : `${T("Le meilleur coup était")} <b class="sqb">${sq(e.pawns[0][bm[0]])}→${sq(bm[1])}</b> ${T(": il te laissait")} ${bestAfter[0]} ${T("déplacements et seulement")} ${bestAfter[1]} ${T("à l'adversaire.")}`);
      trDone(!!ok, txt);
    });
    return;
  }
