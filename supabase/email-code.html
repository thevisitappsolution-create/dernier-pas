<!-- Modèle d'e-mail Supabase (Magic Link et Confirm signup). {{ .Token }} et {{ .ConfirmationURL }} sont remplacés par Supabase. -->
<div style="margin:0;padding:24px 12px;background:#07060f;">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap');
.lx-title{font-family:'Lilita One',Impact,'Arial Black',sans-serif!important}
.lx-body{font-family:'Nunito',Arial,Helvetica,sans-serif!important}
</style>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;margin:0 auto;background:#110e24;background-image:linear-gradient(160deg,#1a1440 0%,#110e24 55%,#07060f 100%);border:1px solid #2c2558;border-radius:24px;box-shadow:0 0 40px rgba(46,242,255,.18);">
<tr><td class="lx-body" style="padding:36px 28px 28px;text-align:center;font-family:Arial,Helvetica,sans-serif;color:#f3f0ff;">

  <div class="lx-title" style="font-family:Impact,'Arial Black',sans-serif;font-size:44px;line-height:1;letter-spacing:2px;color:#2ef2ff;text-shadow:2px 2px 0 #ff3dd8,0 0 14px rgba(46,242,255,.45);">LASTEP</div>
  <div style="height:3px;width:120px;margin:14px auto 26px;background:#ff3dd8;background-image:linear-gradient(90deg,#2ef2ff,#ff3dd8,#b6ff3b);border-radius:3px;"></div>

  <p style="margin:0 0 14px;font-size:17px;font-weight:bold;color:#f3f0ff;">Voici ton code de connexion</p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
    <tr><td class="lx-body" style="padding:16px 26px;background:#07060f;border:2px solid #ff3dd8;border-radius:16px;box-shadow:0 0 16px rgba(255,61,216,.55),inset 0 0 12px rgba(255,61,216,.25);font-family:Arial,Helvetica,sans-serif;font-size:40px;font-weight:800;letter-spacing:10px;color:#ffffff;text-shadow:0 2px 0 #000000;">{{ .Token }}</td></tr>
  </table>

  <p style="margin:24px 0 22px;font-size:15px;color:#a39cd0;">Tape-le dans le jeu, ou touche le bouton&nbsp;:</p>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
    <tr><td style="border-radius:999px;background:#2ef2ff;background-image:linear-gradient(180deg,#7ff8ff,#2ef2ff);box-shadow:0 4px 0 #0e8a96,0 0 22px rgba(46,242,255,.6);">
      <a href="{{ .ConfirmationURL }}" class="lx-body" style="display:inline-block;padding:14px 34px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;letter-spacing:1px;color:#07060f;text-decoration:none;">ME CONNECTER</a>
    </td></tr>
  </table>

  <p style="margin:30px 0 0;font-size:12px;line-height:1.5;color:#a39cd0;">Ce code expire bientôt et ne sert qu'une fois.<br>Si tu n'as rien demandé, ignore cet e-mail.</p>
  <div style="height:1px;margin:20px 0;background:#2c2558;"></div>
  <p style="margin:0;font-size:12px;line-height:1.5;color:#a39cd0;">Your Lastep sign-in code: <b style="color:#f3f0ff;">{{ .Token }}</b><br>Type it in the game or tap the button above.</p>

</td></tr>
</table>
</div>
